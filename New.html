<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synergy OCC Pro</title>
    <style>
        :root {
            --bg-dark: #0b0b0b;
            --blue-ui: #0066cc;
            --yellow-ui: #ffcc00;
            --red-ui: #cc0000;
            --green-ui: #28a745;
            --border: #333;
        }

        * { box-sizing: border-box; font-family: 'RobotoCondensed', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: black; overflow: hidden; color: white; }

        .app-container { display: grid; grid-template-columns: 70px 1fr 200px; height: 100vh; width: 100vw; }

        /* Strany */
        .side-panel { display: flex; flex-direction: column; background: #111; border-right: 1px solid var(--border); }
        .side-btn { flex: 1; border: 1px solid #222; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        /* Střední displej */
        .main-display { background: white; display: flex; flex-direction: column; color: black; position: relative; }
        .status-bar { background: black; color: white; padding: 3px 10px; display: flex; justify-content: space-between; font-size: 14px; font-family: monospace; }
        .delay { background: var(--red-ui); padding: 0 4px; font-weight: bold; }

        .stop-list { flex: 1; overflow-y: auto; font-size: 14px; }
        .stop-row { display: grid; grid-template-columns: 60px 30px 1fr; padding: 5px 8px; border-bottom: 1px solid #eee; font-weight: bold; }

        .price-area { height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 2px solid black; background: #f9f9f9; }
        #ticket-type { font-size: 12px; color: #666; text-transform: uppercase; }
        #display-price { font-size: 40px; color: var(--red-ui); font-weight: bold; line-height: 1; }

        /* Spodní mřížka tarifů - menší tlačítka */
        .tariff-grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 35px); background: #b3e5fc; }
        .t-btn { border: 1px solid #888; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; cursor: pointer; color: black; }
        
        /* Pravý panel */
        .right-panel { background: #1a1a1a; display: flex; flex-direction: column; }
        .num-pad { display: grid; grid-template-columns: repeat(3, 1fr); flex: 1; }
        .key { border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; }
        .key-ok { background: var(--green-ui); }
        .key-esc { background: #e67e22; }

        /* Menu Overlay */
        #menu-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #111; color: white; display: none; z-index: 100;
            grid-template-columns: 1fr 1fr; padding: 10px; gap: 8px;
        }
        .menu-input { background: #222; border: 1px solid var(--blue-ui); padding: 8px; border-radius: 4px; }
        .menu-input label { display: block; font-size: 10px; color: #aaa; }
        .menu-input input { background: transparent; border: none; color: white; width: 100%; font-size: 16px; outline: none; }
        .save-btn { grid-column: span 2; background: var(--blue-ui); padding: 10px; text-align: center; font-weight: bold; border-radius: 4px; }

        /* Pomocné třídy */
        .bg-yellow { background: var(--yellow-ui); color: black; }
        .bg-blue { background: var(--blue-ui); color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="side-panel">
        <div class="side-btn bg-yellow" onclick="beep()">Základ</div>
        <div class="side-btn bg-blue" onclick="beep()">Dálkové</div>
        <div class="side-btn bg-blue" onclick="toggleMenu(); beep()">MENU (F3)</div>
        <div class="side-btn" onclick="beep()">F4</div>
        <div class="side-btn" onclick="beep()">F5</div>
        <div class="side-btn" onclick="beep()">F6</div>
        <div class="side-btn" onclick="beep()">F7</div>
    </div>

    <div class="main-display">
        <!-- Status Bar -->
        <div class="status-bar">
            <span id="live-date">--.--.--</span>
            <span class="delay">-13 m</span>
            <span id="live-time">00:00:00</span>
        </div>

        <!-- Menu -->
        <div id="menu-overlay">
            <div class="menu-input"><label>LINKA</label><input type="text" id="m-linka" value="790"></div>
            <div class="menu-input"><label>SPOJ</label><input type="text" id="m-spoj" value="2"></div>
            <div class="menu-input"><label>KURZ</label><input type="text" id="m-kurz" value="01"></div>
            <div class="menu-input"><label>SMĚR</label><input type="text" id="m-smer" value="Telč"></div>
            <div class="menu-input" style="grid-column: span 2;"><label>ZASTÁVKA</label><input type="text" id="m-zast" value="Studená"></div>
            <div class="save-btn" onclick="saveMenu(); beep()">ULOŽIT A ZAVŘÍT</div>
        </div>

        <div class="stop-list">
            <div class="stop-row" style="background:#fffde7"><span>04:35</span><span style="color:red">25</span><span>Studená, 1.máje</span></div>
            <div class="stop-row" style="background:#fff3e0"><span>04:38</span><span style="color:red">24</span><span>Studená, Bolíkov</span></div>
            <div class="stop-row"><span>04:45</span><span style="color:red">23</span><span>Mrákotín</span></div>
            <div class="stop-row"><span>04:49</span><span style="color:red">22</span><span>Krahulčí</span></div>
        </div>

        <div class="price-area">
            <div id="ticket-type">Vyberte tarif</div>
            <div id="display-price">0,00 Kč</div>
        </div>

        <div class="tariff-grid">
            <div onclick="selectTicket('Základní', 11)" class="t-btn bg-yellow">Základní</div>
            <div onclick="selectTicket('Dítě', 5)" class="t-btn bg-blue">Dítě</div>
            <div onclick="selectTicket('Student', 5)" class="t-btn bg-blue">Student</div>
            <div onclick="selectTicket('Senior 65+', 0)" class="t-btn bg-blue">Osoba 65</div>
            <div onclick="selectTicket('ZTP', 2)" class="t-btn bg-blue">ZTP</div>
            <div onclick="selectTicket('Zavazadlo', 10)" class="t-btn bg-blue">Pes</div>
            <div onclick="selectTicket('Dítě do 6', 0)" class="t-btn bg-blue">Dítě do</div>
            <div onclick="selectTicket('NavUstav', 0)" class="t-btn bg-blue">NavUstav</div>
            <div onclick="selectTicket('Inv3st.', 5)" class="t-btn bg-blue">Inv3st.</div>
            <div class="t-btn bg-blue">▶</div>
        </div>
    </div>

    <div class="right-panel">
        <div style="display:grid; grid-template-columns:1fr 1fr; height:80px;">
            <div class="key bg-blue" style="font-size:12px" onclick="payCard(); beep()">KARTA</div>
            <div class="key bg-blue" style="font-size:12px" onclick="resetAll(); beep()">STORNO</div>
        </div>
        <div class="num-pad">
            <div class="key" onclick="num(7)">7</div><div class="key" onclick="num(8)">8</div><div class="key" onclick="num(9)">9</div>
            <div class="key" onclick="num(4)">4</div><div class="key" onclick="num(5)">5</div><div class="key" onclick="num(6)">6</div>
            <div class="key" onclick="num(1)">1</div><div class="key" onclick="num(2)">2</div><div class="key" onclick="num(3)">3</div>
            <div class="key key-esc" onclick="resetAll()">ESC</div><div class="key" onclick="num(0)">0</div><div class="key key-ok" onclick="printTicket()">✓</div>
        </div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let currentPrice = 0;

    // Funkce pro pípnutí
    function beep() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    // Hodiny a datum
    function updateTime() {
        const now = new Date();
        document.getElementById('live-time').innerText = now.toLocaleTimeString('cs-CZ');
        document.getElementById('live-date').innerText = now.toLocaleDateString('cs-CZ').replace(/\s/g, '');
    }
    setInterval(updateTime, 1000);
    updateTime();

    // Logika jízdenek
    function selectTicket(name, price) {
        beep();
        currentPrice = price;
        document.getElementById('ticket-type').innerText = name;
        document.getElementById('display-price').innerText = price.toFixed(2).replace('.', ',') + " Kč";
    }

    function num(n) {
        beep();
        // Simulace ručního zadání ceny (pro pokročilé)
    }

    function resetAll() {
        beep();
        currentPrice = 0;
        document.getElementById('ticket-type').innerText = "Vyberte tarif";
        document.getElementById('display-price').innerText = "0,00 Kč";
    }

    function payCard() {
        if(currentPrice === 0) return;
        document.getElementById('display-price').innerText = "PŘILOŽTE KARTU";
        setTimeout(() => {
            beep(); beep();
            document.getElementById('display-price').innerText = "ZAPLACENO";
            setTimeout(resetAll, 2000);
        }, 2000);
    }

    function printTicket() {
        if(currentPrice === 0) return;
        beep();
        alert("Tisk jízdenky: " + document.getElementById('ticket-type').innerText);
        resetAll();
    }

    // Menu logika
    function toggleMenu() {
        const menu = document.getElementById('menu-overlay');
        menu.style.display = (menu.style.display === 'grid') ? 'none' : 'grid';
    }

    function saveMenu() {
        const data = {
            linka: document.getElementById('m-linka').value,
            spoj: document.getElementById('m-spoj').value,
            smer: document.getElementById('m-smer').value
        };
        localStorage.setItem('synergy_config', JSON.stringify(data));
        toggleMenu();
    }

    // Načtení menu při startu
    window.onload = () => {
        const saved = localStorage.getItem('synergy_config');
        if(saved) {
            const parsed = JSON.parse(saved);
            document.getElementById('m-linka').value = parsed.linka;
            document.getElementById('m-spoj').value = parsed.spoj;
            document.getElementById('m-smer').value = parsed.smer;
        }
    };
</script>

</body>
</html>
