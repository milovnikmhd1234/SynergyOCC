<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synergy OCC Vertical</title>
    <style>
        :root {
            --bg-dark: #000;
            --blue: #0061c0;
            --yellow: #f1c40f;
            --red: #c0392b;
            --green: #27ae60;
            --border: #333;
        }

        * { box-sizing: border-box; font-family: Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: black; overflow: hidden; color: white; }

        /* Vertikální layout */
        .app-container { 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            width: 100vw; 
        }

        /* 1. HORNÍ LIŠTA (Status) */
        .status-bar { 
            background: black; color: white; padding: 5px 10px; 
            display: flex; justify-content: space-between; font-size: 14px; font-family: monospace;
            border-bottom: 1px solid var(--border);
        }
        .delay { background: var(--red); padding: 0 5px; font-weight: bold; border-radius: 3px; }

        /* 2. DISPLEJ (Zastávky a Cena) */
        .display-section { 
            flex: 1; 
            background: white; 
            color: black; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }

        .stop-list { flex: 1; overflow-y: auto; }
        .stop-row { 
            display: grid; grid-template-columns: 60px 40px 1fr; 
            padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; font-weight: bold; 
        }

        .price-area { 
            height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: #fdfdfd; border-top: 2px solid black; border-bottom: 1px solid #ccc;
        }
        #ticket-type { font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: 1px; }
        #display-price { font-size: 44px; color: var(--red); font-weight: bold; margin: -5px 0; }

        /* 3. STŘEDNÍ BLOK (Boční tlačítka F1-F7 v řadě) */
        .side-functions { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            background: #111; height: 45px;
        }
        .f-btn { border: 0.5px solid #222; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white; }

        /* 4. TARIFNÍ MŘÍŽKA (2 řady nad klávesnicí) */
        .tariff-grid { 
            display: grid; grid-template-columns: repeat(5, 1fr); 
            height: 80px; background: #8ecae6;
        }
        .t-btn { border: 0.5px solid #555; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 10px; color: black; text-align: center; }

        /* 5. NUMERICKÁ KLÁVESNICE (Dole) */
        .bottom-section { 
            display: grid; grid-template-columns: 1fr 100px; 
            height: 220px; background: #1a1a1a;
        }
        .num-pad { display: grid; grid-template-columns: repeat(3, 1fr); flex: 1; }
        .control-pad { display: flex; flex-direction: column; width: 100px; }
        
        .key { border: 0.5px solid #333; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; color: white; }
        .key-ctrl { flex: 1; font-size: 14px; }
        .key-ok { background: var(--green); }
        .key-esc { background: #e67e22; }

        /* Menu Overlay */
        #menu-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); color: white; display: none; z-index: 100;
            flex-direction: column; padding: 20px; gap: 15px;
        }
        .menu-input { background: #222; border: 1px solid var(--blue); padding: 10px; border-radius: 5px; }
        .menu-input input { background: transparent; border: none; color: white; width: 100%; font-size: 18px; outline: none; margin-top: 5px; }

        .bg-yellow { background: var(--yellow); color: black; }
        .bg-blue { background: var(--blue); color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- HORNÍ LIŠTA -->
    <div class="status-bar">
        <span id="live-date"></span> <span class="delay">-13 m</span> <span id="live-time"></span>
    </div>

    <!-- DISPLEJ -->
    <div class="display-section">
        <div id="menu-overlay">
            <h2>Nastavení Menu</h2>
            <div class="menu-input"><label>LINKA</label><input type="text" id="m-linka" value="790"></div>
            <div class="menu-input"><label>SPOJ</label><input type="text" id="m-spoj" value="2"></div>
            <div class="menu-input"><label>SMĚR</label><input type="text" id="m-smer" value="Telč, aut. nádr."></div>
            <button class="key key-ok" style="height: 60px; margin-top: 20px; border-radius: 10px;" onclick="saveMenu()">ULOŽIT A ZAVŘÍT</button>
        </div>

        <div class="stop-list">
            <div class="stop-row" style="background:#fff9c4"><span>04:35</span><span style="color:red">25</span><span>Studená, 1.máje</span></div>
            <div class="stop-row" style="background:#ffecb3"><span>04:38</span><span style="color:red">24</span><span>Studená, Bolíkov</span></div>
            <div class="stop-row"><span>04:45</span><span style="color:red">23</span><span>Mrákotín</span></div>
            <div class="stop-row"><span>04:49</span><span style="color:red">22</span><span>Krahulčí</span></div>
            <div class="stop-row"><span>04:55</span><span style="color:red">21</span><span>Telč, aut. nádr.</span></div>
        </div>

        <div class="price-area">
            <div id="ticket-type">VYBERTE TARIF</div>
            <div id="display-price">0,00 Kč</div>
        </div>
    </div>

    <!-- FUNKČNÍ TLAČÍTKA -->
    <div class="side-functions">
        <div class="f-btn bg-yellow">ZÁKLAD</div>
        <div class="f-btn bg-blue">DÁLKOVÉ</div>
        <div class="f-btn bg-blue" onclick="toggleMenu(); beep()">MENU</div>
        <div class="f-btn" onclick="beep()">PLATBA</div>
    </div>

    <!-- TARIFY -->
    <div class="tariff-grid">
        <div onclick="selectT('Základní', 11)" class="t-btn bg-yellow">Základní</div>
        <div onclick="selectT('Dítě', 5)" class="t-btn bg-blue">Dítě</div>
        <div onclick="selectT('Student', 5)" class="t-btn bg-blue">Student</div>
        <div onclick="selectT('Osoba 65', 0)" class="t-btn bg-blue">Osoba 65</div>
        <div onclick="selectT('ZTP', 2)" class="t-btn bg-blue">ZTP</div>
        <div onclick="selectT('Pes', 10)" class="t-btn bg-blue">Pes</div>
        <div onclick="selectT('Dítě do', 0)" class="t-btn bg-blue">Dítě do</div>
        <div onclick="selectT('NavUstav', 0)" class="t-btn bg-blue">NavUstav</div>
        <div onclick="selectT('Inv3st.', 5)" class="t-btn bg-blue">Inv3st.</div>
        <div class="t-btn bg-blue">▶</div>
    </div>

    <!-- KLÁVESNICE -->
    <div class="bottom-section">
        <div class="num-pad">
            <div class="key" onclick="num(7)">7</div><div class="key" onclick="num(8)">8</div><div class="key" onclick="num(9)">9</div>
            <div class="key" onclick="num(4)">4</div><div class="key" onclick="num(5)">5</div><div class="key" onclick="num(6)">6</div>
            <div class="key" onclick="num(1)">1</div><div class="key" onclick="num(2)">2</div><div class="key" onclick="num(3)">3</div>
            <div class="key key-esc" onclick="reset()">ESC</div><div class="key" onclick="num(0)">0</div><div class="key">.</div>
        </div>
        <div class="control-pad">
            <div class="key key-ctrl bg-blue" onclick="pay()">KARTA</div>
            <div class="key key-ctrl bg-blue" onclick="beep()">STORNO</div>
            <div class="key key-ctrl key-ok" onclick="ok()">TISK ✓</div>
        </div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep() {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination); g.gain.value = 0.1;
        o.frequency.value = 850; o.start(); o.stop(audioCtx.currentTime + 0.05);
    }

    function updateTime() {
        const n = new Date();
        document.getElementById('live-time').innerText = n.toLocaleTimeString('cs-CZ');
        document.getElementById('live-date').innerText = n.toLocaleDateString('cs-CZ').replace(/\s/g, '');
    }
    setInterval(updateTime, 1000); updateTime();

    let price = 0;
    function selectT(n, p) { price = p; document.getElementById('ticket-type').innerText = n; document.getElementById('display-price').innerText = p.toFixed(2).replace('.', ',') + " Kč"; beep(); }
    function num(v) { beep(); } // Zde lze doprogramovat ruční zadávání
    function reset() { price = 0; document.getElementById('ticket-type').innerText = "VYBERTE TARIF"; document.getElementById('display-price').innerText = "0,00 Kč"; beep(); }
    
    function pay() { 
        if(price === 0) return;
        beep(); document.getElementById('display-price').innerText = "PŘILOŽTE...";
        setTimeout(() => { beep(); beep(); document.getElementById('display-price').innerText = "ZAPLACENO"; setTimeout(reset, 1500); }, 1500);
    }

    function ok() { if(price > 0) { alert("Jízdenka se tiskne..."); reset(); } }
    function toggleMenu() { const m = document.getElementById('menu-overlay'); m.style.display = (m.style.display==='flex')?'none':'flex'; }
    function saveMenu() { localStorage.setItem('syn_cfg', document.getElementById('m-linka').value); toggleMenu(); beep(); }
</script>
</body>
</html>
