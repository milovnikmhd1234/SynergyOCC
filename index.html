<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synergy OCC Ultimate Pro v15.0</title>
    <style>
        :root {
            --syn-blue: #004b93;
            --syn-orange: #f39200;
            --syn-green: #28a745;
            --syn-red: #dc3545;
            --syn-dark: #0a0e14;
            --gold: #ffcc00;
            --white: #ffffff;
            --panel: #1a1f26;
            --lcd-bg: #000000;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0; padding: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--white);
        }

        /* HARDWAROVÉ ŠASI */
        #terminal-chassis {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #2a2a2a, #111);
            border: 10px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }

        #glass-display {
            flex: 1;
            margin: 2px;
            background: var(--lcd-bg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
        }

        /* 1. BOOT SEKCE (Dlouhá) */
        #boot-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 10000;
            padding: 30px;
            color: #00ff41;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.4;
            overflow: hidden;
            display: none;
        }

        .boot-cursor {
            display: inline-block;
            width: 8px; height: 15px;
            background: #00ff41;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 2. LOGIN SEKCE */
        #login-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1c2530, #000);
            z-index: 9000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login-frame {
            background: var(--panel);
            padding: 30px;
            border: 1px solid #3d4652;
            width: 360px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }

        .login-screen {
            background: #000;
            color: var(--gold);
            font-size: 38px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #4a5568;
            margin-bottom: 20px;
            letter-spacing: 6px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        /* 3. MENU / EDITOR */
        #menu-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--syn-dark);
            z-index: 8500;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .menu-title {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 900;
        }

        .config-table {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .config-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid #2d3748;
            padding: 12px;
        }

        .config-box.active { border-color: var(--gold); background: rgba(255,204,0,0.05); }
        .config-box label { display: block; font-size: 10px; color: #718096; margin-bottom: 5px; }
        .config-box input, .config-box b { 
            background: transparent; border: none; color: var(--white); font-size: 16px; width: 100%; outline: none;
        }

        .editor-wrap {
            background: #000;
            border: 1px solid #2d3748;
            padding: 10px;
            margin-bottom: 20px;
        }

        .editor-header { font-size: 11px; color: var(--gold); margin-bottom: 10px; display: flex; justify-content: space-between; }
        .stop-input-row { display: grid; grid-template-columns: 1fr 80px 40px; gap: 5px; margin-bottom: 5px; }
        .stop-input-row input { background: #1a202c; border: 1px solid #4a5568; color: #fff; padding: 6px; font-size: 12px; }

        /* 4. HLAVNÍ APLIKACE */
        #app-layer {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .status-bar {
            height: 40px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            border-bottom: 1px solid #2d3748;
        }

        .delay-pill {
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
        }
        .delay-plus { background: var(--syn-red); color: white; }
        .delay-minus { background: var(--syn-green); color: white; }
        .delay-zero { background: #4a5568; color: white; }

        .main-view {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 200px; /* Úzká klávesnice */
            gap: 1px;
            background: #2d3748;
            overflow: hidden;
        }

        /* KASA (ITINERÁŘ) */
        .kasa-list {
            background: #ffffff;
            color: #1a202c;
            overflow-y: auto;
        }

        .kasa-row {
            display: grid;
            grid-template-columns: 60px 45px 1fr;
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
            align-items: center;
            font-size: 15px;
        }

        .kasa-row.active {
            background: var(--syn-orange);
            color: white;
            font-weight: bold;
            border-left: 8px solid var(--syn-blue);
        }

        .kasa-row.passed {
            color: #cbd5e0;
            background: #f7fafc;
        }

        /* NUMERICKÝ BLOK */
        .num-pad {
            background: #1a202c;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            padding: 1px;
        }

        .n-key {
            background: #2d3748;
            color: #fff;
            border: none;
            font-size: 22px;
            font-weight: bold;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .n-key:active { background: #4a5568; }
        .n-key.orange { background: var(--syn-orange); }
        .n-key.green { background: var(--syn-green); }
        .n-key.blue { background: var(--syn-blue); }
        .n-key.wide { grid-column: span 2; }
        .n-key.tall { grid-row: span 2; height: 121px; }
        .n-key.small { font-size: 11px; color: #a0aec0; text-transform: uppercase; }

        /* SPODNÍ PANEL JÍZDNÉHO */
        .fare-grid {
            height: 120px;
            background: #000;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            padding: 2px;
        }

        .f-btn {
            background: var(--syn-blue);
            color: white;
            border: none;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .f-btn.active { background: var(--gold); color: #000; }
        .f-btn.sys { background: #2d3748; color: var(--gold); }

        .price-float {
            position: absolute;
            bottom: 125px;
            right: 210px;
            font-size: 38px;
            font-weight: 900;
            color: var(--syn-red);
            text-shadow: 2px 2px 0 white;
            pointer-events: none;
            z-index: 100;
        }

        /* SPECIÁLNÍ REŽIMY OVERLAY */
        #special-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 8000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .pauza-theme { background: linear-gradient(135deg, #001a33, #000); }
        .sluzebni-theme { background: repeating-linear-gradient(45deg, #000, #000 20px, #0a0a0a 20px, #0a0a0a 40px); }

        /* 🍄 POWER BUTTON */
        #mush-power {
            position: absolute;
            bottom: 20px; left: 20px;
            width: 65px; height: 65px;
            background: #222;
            border-radius: 50%;
            z-index: 11000;
            display: flex;
            justify-content: center; align-items: center;
            font-size: 32px;
            border: 4px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: pointer;
        }

    </style>
</head>
<body>

<div id="terminal-chassis">
    <div id="mush-power" onclick="initBootSequence()">🍄</div>

    <div id="glass-display">
        
        <div id="boot-layer"></div>

        <div id="login-layer">
            <div class="login-frame">
                <div id="login-label" style="font-size:12px; margin-bottom:10px; color:#a0aec0">SYNERGY SECURITY - ZADEJTE ID</div>
                <div class="login-screen" id="login-val">ID?</div>
                <div class="num-pad" style="background:transparent">
                    <button class="n-key" onclick="pressL(1)">1</button><button class="n-key" onclick="pressL(2)">2</button><button class="n-key" onclick="pressL(3)">3</button>
                    <button class="n-key" onclick="pressL(4)">4</button><button class="n-key" onclick="pressL(5)">5</button><button class="n-key" onclick="pressL(6)">6</button>
                    <button class="n-key" onclick="pressL(7)">7</button><button class="n-key" onclick="pressL(8)">8</button><button class="n-key" onclick="pressL(9)">9</button>
                    <button class="n-key small" onclick="clearL()">C</button><button class="n-key" onclick="pressL(0)">0</button><button class="n-key green" onclick="submitL()">OK</button>
                </div>
            </div>
        </div>

        <div id="menu-layer">
            <div class="menu-title">Konfigurace Terminálu</div>
            <div class="config-table">
                <div class="config-box active" id="m-line" onclick="setMTarget('line')">
                    <label>Linka</label><b id="v-m-line">790968</b>
                </div>
                <div class="config-box" id="m-spoj" onclick="setMTarget('spoj')">
                    <label>Spoj</label><b id="v-m-spoj">2</b>
                </div>
                <div class="config-box wide" style="grid-column: span 2;">
                    <label>Název dopravce</label>
                    <input type="text" id="v-m-carrier" placeholder="Zadejte dopravce..." value="IDSJMK">
                </div>
            </div>

            <div class="editor-wrap">
                <div class="editor-header">
                    <span>EDITOR TRASY (Zastávka | Čas)</span>
                    <button onclick="addStopRow()" style="background:var(--syn-green); border:none; color:#fff; padding:2px 8px; font-size:10px">+ PŘIDAT</button>
                </div>
                <div id="editor-list"></div>
            </div>

            <div style="flex:1"></div>
            <div class="num-pad" style="max-width:300px; margin: 0 auto;">
                <button class="n-key" onclick="pressM(7)">7</button><button class="n-key" onclick="pressM(8)">8</button><button class="n-key" onclick="pressM(9)">9</button>
                <button class="n-key" onclick="pressM(4)">4</button><button class="n-key" onclick="pressM(5)">5</button><button class="n-key" onclick="pressM(6)">6</button>
                <button class="n-key" onclick="pressM(1)">1</button><button class="n-key" onclick="pressM(2)">2</button><button class="n-key" onclick="pressM(3)">3</button>
                <button class="n-key small" onclick="clearM()">C</button><button class="n-key" onclick="pressM(0)">0</button><button class="n-key green" onclick="saveMenu()">ULOŽIT</button>
            </div>
            <button onclick="closeMenu()" style="width:100%; margin-top:10px; padding:10px; background:var(--syn-red); border:none; color:white; font-weight:bold">ZAVŘÍT BEZ ULOŽENÍ</button>
        </div>

        <div id="app-layer">
            <div id="special-view">
                <h1 id="spec-title" style="font-size:50px; color:var(--gold); margin-bottom:20px;">PAUZA</h1>
                <div id="spec-sub" style="font-size:20px;">Čas do konce: <span id="spec-timer">15:00</span></div>
                <button onclick="openMenu()" style="margin-top:50px; padding:20px 40px; background:var(--syn-blue); border:none; color:white; font-weight:bold">UKONČIT REŽIM</button>
            </div>

            <div class="status-bar">
                <span id="st-ids">790968 / 2</span>
                <span id="st-carrier" style="color:var(--syn-orange); font-weight:bold">IDSJMK</span>
                <div id="st-delay" class="delay-pill delay-zero">+0 min</div>
                <span id="st-clock">00:00:00</span>
            </div>

            <div class="main-view">
                <div class="kasa-list" id="itinerary-box"></div>
                <div class="num-pad">
                    <button class="n-key small">ZÓNA</button><button class="n-key" onclick="pressA(7)">7</button><button class="n-key" onclick="pressA(8)">8</button><button class="n-key" onclick="pressA(9)">9</button>
                    <button class="n-key small">TARIF</button><button class="n-key" onclick="pressA(4)">4</button><button class="n-key" onclick="pressA(5)">5</button><button class="n-key" onclick="pressA(6)">6</button>
                    <button class="n-key small">KARTA</button><button class="n-key" onclick="pressA(1)">1</button><button class="n-key" onclick="pressA(2)">2</button><button class="n-key" onclick="pressA(3)">3</button>
                    <button class="n-key small" onclick="clearA()">STOR</button><button class="n-key" onclick="pressA(0)">0</button><button class="n-key orange tall" onclick="nextStop()">DALŠÍ</button>
                    <button class="n-key green wide" onclick="doSale()">POTVRDIT</button>
                </div>
            </div>

            <div class="price-float" id="price-val">11,00 Kč</div>

            <div class="fare-grid">
                <button class="f-btn sys" onclick="openMenu()">MENU</button>
                <button class="f-btn active" onclick="setPrice(this, 11)">Základní</button>
                <button class="f-btn" onclick="setPrice(this, 5)">Dítě</button>
                <button class="f-btn" onclick="setPrice(this, 8)">Student</button>
                <button class="f-btn" onclick="setPrice(this, 8)">Senior</button>
                <button class="f-btn" onclick="setPrice(this, 0)">ZTP</button>
                <button class="f-btn" onclick="setPrice(this, 7)">Pes</button>
                <button class="f-btn" onclick="setPrice(this, 0)">Zavaz.</button>
                <button class="f-btn" onclick="setPrice(this, 15)">Kolo</button>
                <button class="f-btn sys" style="background:var(--syn-red)" onclick="location.reload()">OFF</button>
            </div>
        </div>

    </div>
</div>

<audio id="snd-gong" src="gong.mp3" preload="auto"></audio>

<script>
    /**
     * SYNERGY OCC CORE v15.0.0
     */

    const DATABASE = {
        users: [
            {id: "10342", pin: "3508", n: "Řidič"}, {id: "20551", pin: "1234", n: "Střídač"},
            {id: "99999", pin: "0000", n: "Revizor"}, {id: "11111", pin: "8888", n: "Servis"},
            {id: "54321", pin: "1111", n: "Junior"}
        ],
        initStops: [
            {n: "Brno,,ÚAN Zvonařka", t: "08:00"}, {n: "Brno,,Ústřední hřbitov", t: "08:12"},
            {n: "Modřice,,u hřbitova", t: "08:22"}, {n: "Rajhrad,,u kláštera", t: "08:35"},
            {n: "Židlochovice,,nám.", t: "08:50"}
        ]
    };

    let state = {
        isBooted: false, logStep: 1, logBuf: "", curUser: null,
        mTarget: 'line',
        line: "790968", spoj: "2", carrier: "IDSJMK",
        stops: JSON.parse(JSON.stringify(DATABASE.initStops)),
        idx: 0, price: 11, appBuf: ""
    };

    // --- 1. BOOT SEQUENCE ---
    function initBootSequence() {
        if(state.isBooted) return;
        const b = document.getElementById('boot-layer');
        b.style.display = 'block';

        const lines = [
            "SYNERGY OCC BIOS v15.0.4 (c) 2026",
            "Initializing Hardware Abstraction Layer...",
            "Checking CPU: ARM Cortex-A72 Octa-Core @ 2.5GHz... OK",
            "Checking RAM: 8192MB LPDDR4... OK",
            "Mounting /dev/sda1 (System Partition)...",
            "Verifying System Integrity [####################] 100%",
            "Loading Network Stack: LTE-Advanced (O2-CZ)... ACTIVE",
            "GNSS Fix: Lat 49.1952, Lon 16.6083... PRECISION 0.8m",
            "Connecting to Synergy Cloud Services... CONNECTED",
            "Synchronizing Route Database (v2026.05)... DONE",
            "Starting Synergy GUI Server...",
            "Loading User Security Profiles...",
            "SYSTEM READY. WAITING FOR AUTHENTICATION."
        ];

        let i = 0;
        const interval = setInterval(() => {
            const row = document.createElement('div');
            row.innerHTML = `[${new Date().getMilliseconds()}ms] ${lines[i]}`;
            b.appendChild(row);
            b.scrollTop = b.scrollHeight;
            i++;
            if(i >= lines.length) {
                clearInterval(interval);
                setTimeout(() => {
                    b.style.display = 'none';
                    document.getElementById('login-layer').style.display = 'flex';
                }, 1000);
            }
        }, 180); // Delší načítání
    }

    // --- 2. LOGIN LOGIC ---
    function pressL(n) { state.logBuf += n; updLoginUI(); }
    function clearL() { state.logBuf = ""; updLoginUI(); }
    function updLoginUI() {
        const d = document.getElementById('login-val');
        const l = document.getElementById('login-label');
        if(state.logStep === 1) {
            d.innerText = state.logBuf || "ID?";
            l.innerText = "SYNERGY SECURITY - ZADEJTE OSOBNÍ ID";
        } else {
            d.innerText = "*".repeat(state.logBuf.length) || "PIN?";
            l.innerText = "SYNERGY SECURITY - ZADEJTE PIN";
        }
    }
    function submitL() {
        if(state.logStep === 1) {
            const user = DATABASE.users.find(u => u.id === state.logBuf);
            if(user) { state.curUser = user; state.logStep = 2; state.logBuf = ""; updLoginUI(); }
            else { alert("Neznámé ID!"); clearL(); }
        } else {
            if(state.logBuf === state.curUser.pin) {
                document.getElementById('login-layer').style.display = 'none';
                document.getElementById('app-layer').style.display = 'flex';
                state.isBooted = true;
                startApp();
            } else { alert("Chybné PIN!"); clearL(); }
        }
    }

    // --- 3. MENU & EDITOR ---
    function openMenu() {
        document.getElementById('menu-layer').style.display = 'flex';
        renderEditor();
    }
    function closeMenu() { document.getElementById('menu-layer').style.display = 'none'; }
    function setMTarget(t) {
        state.mTarget = t;
        document.querySelectorAll('.config-box').forEach(b => b.classList.remove('active'));
        document.getElementById(`m-${t}`).classList.add('active');
    }
    function pressM(n) {
        let el = document.getElementById(`v-m-${state.mTarget}`);
        el.innerText = (el.innerText === "0" || el.innerText === "790968") ? n : el.innerText + n;
    }
    function clearM() { document.getElementById(`v-m-${state.mTarget}`).innerText = "0"; }

    function renderEditor() {
        const list = document.getElementById('editor-list');
        list.innerHTML = "";
        state.stops.forEach((s, i) => {
            list.innerHTML += `
                <div class="stop-input-row">
                    <input type="text" value="${s.n}" onchange="updateStop(${i}, 'n', this.value)">
                    <input type="text" value="${s.t}" onchange="updateStop(${i}, 't', this.value)">
                    <button onclick="removeStop(${i})" style="background:var(--syn-red); border:none; color:white;">X</button>
                </div>
            `;
        });
    }
    function addStopRow() { state.stops.push({n: "Zastávka", t: "00:00"}); renderEditor(); }
    function updateStop(i, key, val) { state.stops[i][key] = val; }
    function removeStop(i) { state.stops.splice(i, 1); renderEditor(); }

    function saveMenu() {
        state.line = document.getElementById('v-m-line').innerText;
        state.spoj = document.getElementById('v-m-spoj').innerText;
        state.carrier = document.getElementById('v-m-carrier').value;
        state.idx = 0;
        
        applySpecialModes();
        updateUI();
        closeMenu();
    }

    function applySpecialModes() {
        const overlay = document.getElementById('special-view');
        const main = document.querySelector('.main-view');
        const fare = document.querySelector('.fare-grid');
        
        overlay.style.display = "none";
        main.style.visibility = "visible";
        fare.style.visibility = "visible";

        if(state.line === "10836102") {
            overlay.style.display = "flex";
            overlay.className = "pauza-theme";
            document.getElementById('spec-title').innerText = "PAUZA";
            document.getElementById('spec-sub').style.display = "block";
            main.style.visibility = "hidden";
            fare.style.visibility = "hidden";
        } else if(state.line === "6252") {
            overlay.style.display = "flex";
            overlay.className = "sluzebni-theme";
            document.getElementById('spec-title').innerText = "SLUŽEBNÍ JÍZDA";
            document.getElementById('spec-sub').style.display = "none";
            main.style.visibility = "hidden";
            fare.style.visibility = "hidden";
        }
    }

    // --- 4. APP LOGIC & DELAY TRACKER ---
    function startApp() {
        updateUI();
        setInterval(tick, 1000);
    }

    function tick() {
        const now = new Date();
        document.getElementById('st-clock').innerText = now.toLocaleTimeString('cs-CZ');
        calculateDelay(now);
    }

    function calculateDelay(now) {
        if(state.line === "10836102" || state.line === "6252") return;
        
        const scheduledTime = state.stops[state.idx].t.split(':');
        const schedDate = new Date();
        schedDate.setHours(scheduledTime[0], scheduledTime[1], 0);

        const diffSeconds = Math.floor((now - schedDate) / 1000);
        const diffMinutes = Math.floor(diffSeconds / 60);

        const el = document.getElementById('st-delay');
        if(diffMinutes > 0) {
            el.innerText = `+${diffMinutes} min`;
            el.className = "delay-pill delay-plus";
        } else if(diffMinutes < 0) {
            el.innerText = `${diffMinutes} min`;
            el.className = "delay-pill delay-minus";
        } else {
            el.innerText = "+0 min";
            el.className = "delay-pill delay-zero";
        }
    }

    function updateUI() {
        document.getElementById('st-ids').innerText = `${state.line} / ${state.spoj}`;
        document.getElementById('st-carrier').innerText = state.carrier;
        renderItinerary();
    }

    function renderItinerary() {
        const box = document.getElementById('itinerary-box');
        box.innerHTML = "";
        state.stops.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = `kasa-row ${i === state.idx ? 'active' : ''} ${i < state.idx ? 'passed' : ''}`;
            row.innerHTML = `<div>${s.t}</div><div>25|</div><div>${s.n}</div>`;
            box.appendChild(row);
        });
        const active = box.querySelector('.active');
        if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function nextStop() {
        if(state.idx < state.stops.length - 1) {
            state.idx++;
            renderItinerary();
            const g = document.getElementById('snd-gong');
            g.currentTime = 0; g.play().catch(()=>{});
        }
    }

    function setPrice(btn, p) {
        document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.price = p;
        document.getElementById('price-val').innerText = p.toFixed(2).replace('.', ',') + " Kč";
    }

    function doSale() {
        alert("JÍZDENKA SYNERGY\n----------------\nDopravce: " + state.carrier + "\nLinka: " + state.line + "\nCena: " + state.price + " Kč\nUživatel: " + state.curUser.n);
    }

    function pressA(n) { state.appBuf += n; }
    function clearA() { state.appBuf = ""; }

</script>
</body>
</html>
