<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synergy OCC - Professional Edition</title>
    <style>
        /* CSS DEFINICE - KOMPLETNÍ STYLING */
        :root {
            --syn-blue: #004b93;
            --syn-dark: #011d3a;
            --syn-orange: #f39200;
            --syn-yellow: #ffcc00;
            --syn-green: #4db748;
            --syn-red: #cc0000;
            --syn-light-blue: #00a4e4;
            --lcd-white: #ffffff;
            --lcd-grey: #e0e0e0;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        /* HLAVNÍ RÁM ZAŘÍZENÍ - KOMPAKTNÍ VELIKOST */
        #occ-frame {
            width: 980px;
            height: 600px;
            background: var(--syn-blue);
            border-radius: 30px;
            padding: 20px;
            position: relative;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 30px 60px rgba(0,0,0,0.9);
            border: 10px solid #00264d;
            display: flex;
            flex-direction: column;
        }

        /* DISPLEJ */
        #screen {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 4px solid #111;
        }

        /* BOOT SCREEN - 14 AKCÍ */
        #boot-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            padding: 40px;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            display: none; /* Zapne se přes JS */
        }

        /* HLAVNÍ UI */
        .ui-root {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #000;
        }

        /* TOP BAR */
        .header {
            height: 40px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 2px solid #222;
        }

        .delay-tag {
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 20px;
            min-width: 70px;
            text-align: center;
        }
        .delay-late { background: var(--syn-red); color: #fff; }
        .delay-ok { background: #444; color: #fff; }

        /* PRACOVNÍ PLOCHA */
        .main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 85px 1fr 300px;
            background: #333;
            gap: 2px;
            overflow: hidden;
        }

        /* LEVÝ PANEL (VSTUPY LINKA/SPOJ) */
        .side-inputs {
            background: #111;
            display: flex;
            flex-direction: column;
            padding: 10px 5px;
            gap: 10px;
        }
        .input-label { font-size: 10px; color: #777; text-align: center; text-transform: uppercase; }
        .input-value {
            background: #222;
            border: 1px solid var(--syn-light-blue);
            color: var(--syn-yellow);
            text-align: center;
            padding: 8px 0;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* STŘEDNÍ PANEL (ITINERÁŘ) */
        .itinerary {
            background: var(--lcd-white);
            color: #000;
            overflow-y: auto;
            position: relative;
        }
        .stop-item {
            display: grid;
            grid-template-columns: 75px 40px 1fr;
            padding: 10px 15px;
            border-bottom: 1px solid #ddd;
            font-size: 18px;
            align-items: center;
        }
        .stop-item.active {
            background: var(--syn-orange);
            color: #fff;
            font-weight: bold;
        }

        .floating-price {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            font-weight: 900;
            color: var(--syn-red);
            text-shadow: 2px 2px 0 #fff;
            z-index: 100;
        }

        /* PRAVÝ PANEL (NUMERIKA) */
        .keypad {
            background: #bbb;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            padding: 4px;
        }
        .k-btn {
            background: var(--syn-blue);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border: 1px solid #002d5a;
            cursor: pointer;
            height: 65px;
        }
        .k-btn:active { background: var(--syn-light-blue); }
        .k-btn.f { background: #555; font-size: 14px; }
        .k-btn.orange { background: var(--syn-orange); }
        .k-btn.green { background: var(--syn-green); }

        /* SPODNÍ PANEL (JÍZDENKY) */
        .ticket-panel {
            height: 120px;
            background: #222;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            padding: 4px;
        }
        .t-btn {
            background: var(--syn-light-blue);
            color: #fff;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .t-btn.selected { background: var(--syn-yellow); color: #000; }
        .t-btn.red { background: var(--syn-red); }

        /* 🍄 POWER BUTTON */
        #pwr-btn {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 60px;
            height: 60px;
            background: #333;
            border: 4px solid #555;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            cursor: pointer;
            z-index: 2000;
            transition: 0.2s;
        }
        #pwr-btn:hover { background: #444; }

        /* MODÁL PRO ZADÁVÁNÍ */
        #modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5000;
        }
        .modal-box {
            background: #333;
            padding: 25px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
        }
        .modal-display {
            background: #000;
            color: var(--syn-green);
            font-family: monospace;
            font-size: 32px;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #555;
        }
    </style>
</head>
<body>

<div id="occ-frame">
    <div id="pwr-btn" onclick="startSystem()">🍄</div>

    <div id="screen">
        <div id="boot-layer"></div>

        <div id="app-ui" class="ui-root">
            <div class="header">
                <span id="txt-line-info">Jízda: 790968 / 2</span>
                <span>07.05.2026</span>
                <div id="val-delay" class="delay-tag delay-ok">+0 m</div>
                <span id="val-clock">00:00:00</span>
            </div>

            <div class="main-grid">
                <div class="side-inputs">
                    <div class="input-label">Linka</div>
                    <div class="input-value" onclick="openInput('line')">790968</div>
                    <div class="input-label">Spoj</div>
                    <div class="input-value" onclick="openInput('spoj')">2</div>
                    <div style="flex:1"></div>
                    <div class="input-value f" style="color:white" onclick="location.reload()">RESET</div>
                </div>

                <div class="itinerary" id="stop-container">
                    </div>

                <div class="keypad">
                    <div class="k-btn f">Přestup</div><div class="k-btn">7</div><div class="k-btn">8</div><div class="k-btn">9</div>
                    <div class="k-btn f">Multi.</div><div class="k-btn">4</div><div class="k-btn">5</div><div class="k-btn">6</div>
                    <div class="k-btn f">Karta</div><div class="k-btn">1</div><div class="k-btn">2</div><div class="k-btn">3</div>
                    <div class="k-btn f" onclick="clearBuffer()">Storno</div><div class="k-btn">.</div><div class="k-btn">0</div><div class="k-btn">±</div>
                    <div class="k-btn orange" style="grid-column: span 2" onclick="nextStop()">DALŠÍ</div>
                    <div class="k-btn green" style="grid-column: span 2" onclick="sellTicket()">
                        <svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>

                <div class="floating-price" id="val-price">11,00 Kč</div>
            </div>

            <div class="ticket-panel">
                <button class="t-btn selected" onclick="changeCat(this, 11)">Základní</button>
                <button class="t-btn" onclick="changeCat(this, 5)">Dítě</button>
                <button class="t-btn" onclick="changeCat(this, 8)">Student</button>
                <button class="t-btn" onclick="changeCat(this, 8)">Osoba 65</button>
                <button class="t-btn" onclick="changeCat(this, 0)">ZTP</button>
                <button class="t-btn" onclick="changeCat(this, 7)">Pes</button>
                <button class="t-btn" onclick="changeCat(this, 0)">Dítě do</button>
                <button class="t-btn" onclick="changeCat(this, 0)">NavUstav</button>
                <button class="t-btn" onclick="changeCat(this, 0)">Inv3st.</button>
                <button class="t-btn red" onclick="location.reload()">ESC / KONEC</button>
            </div>
        </div>

        <div id="modal">
            <div class="modal-box">
                <h3 id="modal-title" style="color:#fff; margin-top:0">Zadejte hodnotu</h3>
                <div class="modal-display" id="modal-val">---</div>
                <div class="keypad" style="grid-template-columns: repeat(3, 1fr); background:transparent">
                    <div class="k-btn" onclick="modType(1)">1</div><div class="k-btn" onclick="modType(2)">2</div><div class="k-btn" onclick="modType(3)">3</div>
                    <div class="k-btn" onclick="modType(4)">4</div><div class="k-btn" onclick="modType(5)">5</div><div class="k-btn" onclick="modType(6)">6</div>
                    <div class="k-btn" onclick="modType(7)">7</div><div class="k-btn" onclick="modType(8)">8</div><div class="k-btn" onclick="modType(9)">9</div>
                    <div class="k-btn red" onclick="modClear()">C</div><div class="k-btn" onclick="modType(0)">0</div><div class="k-btn green" onclick="modConfirm()">OK</div>
                </div>
            </div>
        </div>
    </div>
</div>

<audio id="snd-gong" src="gong.mp3" preload="auto"></audio>

<script>
    // --- DATA ---
    const STOPS = [
        { name: "Studená,,ul.1.máje a", time: "19:35" },
        { name: "Studená,,H.Bolíko,roz", time: "19:38" },
        { name: "Mrákotín", time: "19:45" },
        { name: "Krahulčí", time: "19:49" },
        { name: "Telč,,aut.nádr.", time: "19:59" },
        { name: "Telč,,Interiér", time: "20:01" },
        { name: "Dyjice,Dolní Dvorce", time: "20:03" },
        { name: "Radkov", time: "20:08" }
    ];

    let state = {
        line: "790968",
        spoj: "2",
        activeIdx: 0,
        price: 11,
        isBooted: false,
        buffer: "",
        target: ""
    };

    // --- BOOTOVÁNÍ (14 AKCÍ) ---
    function startSystem() {
        if(state.isBooted) return;
        const layer = document.getElementById('boot-layer');
        layer.style.display = 'block';

        // Odblokování audia
        document.getElementById('snd-gong').play().then(()=> {
            document.getElementById('snd-gong').pause();
            document.getElementById('snd-gong').currentTime = 0;
        }).catch(()=>{});

        const logActions = [
            "Initializing SYNERGY OCC Hardware...",
            "CPU: ARM Cortex-A53 1.4GHz detected.",
            "RAM Check: 1024MB ... OK",
            "Storage: onboard eMMC 8GB ... mounted.",
            "Loading Linux Kernel 5.10.24-syn ...",
            "Starting Network Services (LTE/GPRS) ... OK",
            "Connecting to ROPID Dispatch Center ... Connected.",
            "Initializing VDV-KA Smartcard Module ... OK",
            "Loading Stop Database: 12.500 entries loaded.",
            "GPS Lock: 49.1923N, 15.4512E (Fixed).",
            "Verifying Driver Credentials ... Driver 10342 OK.",
            "Loading Graphical User Interface ...",
            "Syncing System Time via NTP ... Done.",
            "SYSTEM READY. Starting Service Mode."
        ];

        let step = 0;
        const interval = setInterval(() => {
            layer.innerHTML += `<div><span style="color:#555">[${new Date().toLocaleTimeString()}]</span> ${logActions[step]}</div>`;
            layer.scrollTop = layer.scrollHeight;
            step++;
            if(step >= logActions.length) {
                clearInterval(interval);
                setTimeout(() => {
                    layer.style.display = 'none';
                    document.getElementById('app-ui').style.display = 'flex';
                    state.isBooted = true;
                    initApp();
                }, 1000);
            }
        }, 180);
    }

    // --- APLIKACE ---
    function initApp() {
        renderStops();
        updateDisplay();
        setInterval(tick, 1000);
    }

    function tick() {
        const now = new Date();
        document.getElementById('val-clock').innerText = now.toLocaleTimeString('cs-CZ');
        
        // Výpočet zpoždění
        const planStr = STOPS[state.activeIdx].time;
        const [ph, pm] = planStr.split(':').map(Number);
        const pDate = new Date();
        pDate.setHours(ph, pm, 0);

        const diff = Math.floor((now - pDate) / 60000);
        const delEl = document.getElementById('val-delay');
        delEl.innerText = (diff >= 0 ? "+" : "") + diff + " m";
        delEl.className = `delay-tag ${diff > 0 ? 'delay-late' : 'delay-ok'}`;
    }

    function renderStops() {
        const cont = document.getElementById('stop-container');
        cont.innerHTML = '';
        STOPS.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = `stop-item ${i === state.activeIdx ? 'active' : ''}`;
            div.innerHTML = `<div>${s.time}</div><div style="font-size:11px; color:#888">21|</div><div>${s.name}</div>`;
            cont.appendChild(div);
        });
        const act = cont.querySelector('.active');
        if(act) act.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function nextStop() {
        if(state.activeIdx < STOPS.length - 1) {
            state.activeIdx++;
            renderStops();
            playGong();
        }
    }

    function playGong() {
        const g = document.getElementById('snd-gong');
        g.currentTime = 0;
        g.play().catch(()=>{});
    }

    function changeCat(btn, p) {
        document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.price = p;
        document.getElementById('val-price').innerText = p.toFixed(2).replace('.', ',') + " Kč";
    }

    function sellTicket() {
        alert("Jízdenka vytisknuta.");
    }

    function clearBuffer() {
        console.log("Storno");
    }

    // --- MODÁL LINKA/SPOJ ---
    function openInput(t) {
        state.target = t;
        state.buffer = "";
        document.getElementById('modal-title').innerText = t === 'line' ? "Zadejte Linku" : "Zadejte Spoj";
        document.getElementById('modal-val').innerText = "_";
        document.getElementById('modal').style.display = 'flex';
    }

    function modType(n) {
        state.buffer += n;
        document.getElementById('modal-val').innerText = state.buffer;
    }

    function modClear() {
        state.buffer = "";
        document.getElementById('modal-val').innerText = "_";
    }

    function modConfirm() {
        if(state.target === 'line') state.line = state.buffer;
        else state.spoj = state.buffer;
        
        document.getElementById('txt-line-info').innerText = `Jízda: ${state.line} / ${state.spoj}`;
        const inputs = document.querySelectorAll('.input-value');
        if(state.target === 'line') inputs[0].innerText = state.line;
        else inputs[1].innerText = state.spoj;

        document.getElementById('modal').style.display = 'none';
    }

    function updateDisplay() {
        document.getElementById('txt-line-info').innerText = `Jízda: ${state.line} / ${state.spoj}`;
    }
</script>

</body>
</html>
