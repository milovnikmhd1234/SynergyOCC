<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synergy OCC Enterprise - Mobile v10.0</title>
    <style>
        /* SYNERGY OCC ENTERPRISE EDITION v10.0
           Full Responsive Design for Mobile Devices
           Radical Layout Optimization & Multi-User Support
        */
        :root {
            --syn-blue: #004b93;
            --syn-dark: #001021;
            --syn-orange: #f39200;
            --syn-yellow: #ffcc00;
            --syn-green: #4db748;
            --syn-red: #cc0000;
            --syn-sky: #00a4e4;
            --white: #ffffff;
            --black: #000000;
            --grey-1: #1a1a1a;
            --grey-2: #333333;
            --grey-3: #555555;
            --grey-4: #888888;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0; padding: 0;
            user-select: none;
            outline: none;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            height: 100vh;
            width: 100vw;
            display: flex;
            overflow: hidden;
            flex-direction: column;
        }

        /* HLAVNÍ ŠASI ZAŘÍZENÍ */
        #occ-terminal {
            width: 100%;
            height: 100%;
            background: var(--syn-blue);
            display: flex;
            flex-direction: column;
            border: 6px solid var(--syn-dark);
            position: relative;
        }

        #lcd-glass {
            flex: 1;
            background: #000;
            margin: 3px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 10px #000;
        }

        /* BOOTOVACÍ OBRAZOVKA (ROZŠÍŘENÁ) */
        #boot-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 10000;
            padding: 25px;
            color: #00ff00;
            font-size: 11px;
            line-height: 1.3;
            overflow-y: auto;
            display: none;
        }

        /* PŘIHLÁŠENÍ S VÝBĚREM UŽIVATELE */
        #login-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            z-index: 9000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-header { color: var(--syn-sky); font-size: 18px; margin-bottom: 20px; text-transform: uppercase; }
        
        .user-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
        }

        .user-btn {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            font-size: 11px;
            cursor: pointer;
        }

        .user-btn.active {
            background: var(--syn-orange);
            border-color: #fff;
            font-weight: bold;
        }

        .login-input-field {
            background: #000;
            color: var(--syn-yellow);
            font-size: 38px;
            padding: 8px 15px;
            border: 2px solid var(--grey-3);
            margin-bottom: 15px;
            min-width: 240px;
            text-align: center;
            letter-spacing: 5px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MENU NASTAVENÍ (SPOJ/LINKA/ZASTÁVKA) */
        #menu-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--syn-dark);
            z-index: 8500;
            display: none;
            flex-direction: column;
            padding: 15px;
        }

        .setup-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .setup-box {
            background: #000;
            border: 1px solid var(--syn-sky);
            padding: 12px;
            text-align: center;
        }

        .setup-box.selected {
            border: 2px solid var(--syn-yellow);
            background: #1a1a1a;
        }

        .setup-box label { display: block; font-size: 9px; color: #aaa; margin-bottom: 4px; }
        .setup-box span { font-size: 18px; color: var(--syn-yellow); font-weight: bold; }

        /* HLAVNÍ ROZHRANÍ TERMINÁLU */
        #app-layer {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .top-bar {
            height: 40px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border-bottom: 2px solid var(--grey-2);
        }

        .info-pill { padding: 3px 12px; border-radius: 4px; font-weight: bold; font-size: 16px; }
        .info-pill.red { background: var(--syn-red); }
        .info-pill.norm { background: var(--grey-3); }

        .workspace-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 100px 1fr 240px;
            background: var(--grey-3);
            gap: 1px;
            overflow: hidden;
        }

        /* LEVÝ PANEL - STATY */
        .left-stats {
            background: var(--grey-1);
            display: flex;
            flex-direction: column;
            padding: 5px;
            gap: 10px;
        }

        .stat-unit { text-align: center; }
        .stat-unit label { font-size: 8px; color: #666; display: block; }
        .stat-unit div { background: #000; border: 1px solid var(--syn-sky); color: var(--syn-yellow); padding: 5px 0; font-size: 12px; }

        /* ITINERÁŘ */
        .stop-scroller {
            background: var(--white);
            color: #000;
            overflow-y: auto;
            position: relative;
        }

        .stop-item {
            display: grid;
            grid-template-columns: 55px 35px 1fr;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            align-items: center;
        }

        .stop-item.active { background: var(--syn-orange); color: #fff; font-weight: bold; border-left: 5px solid var(--syn-dark); }
        .stop-item.past { color: #bbb; }

        /* KLÁVESNICE */
        .numpad-grid {
            background: var(--grey-4);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            padding: 1px;
        }

        .k {
            background: var(--syn-blue);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            border: none;
            height: 55px;
        }

        .k:active { background: var(--syn-sky); }
        .k.alt { background: #444; font-size: 11px; }
        .k.warn { background: var(--syn-orange); }
        .k.go { background: var(--syn-green); }

        /* SPODNÍ TLAČÍTKA JÍZDENEK */
        .ticket-strip {
            height: 100px;
            background: #0a0a0a;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 1px;
            padding: 2px;
        }

        .t-btn {
            background: var(--syn-sky);
            color: #fff;
            border: none;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .t-btn.selected { background: var(--syn-yellow); color: #000; }
        .t-btn.menu { background: #333; color: var(--syn-yellow); border: 1px solid #555; }
        .t-btn.exit { background: var(--syn-red); }

        /* PLOVOUCÍ CENA */
        .price-overlay {
            position: absolute;
            bottom: 115px;
            right: 255px;
            font-size: 38px;
            font-weight: 900;
            color: var(--syn-red);
            text-shadow: 2px 2px 0 #fff;
            pointer-events: none;
        }

        /* 🍄 POWER SENSOR */
        #pwr-sensor {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 55px;
            height: 55px;
            background: #222;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            z-index: 11000;
            border: 3px solid var(--grey-3);
            box-shadow: 0 0 20px rgba(0,0,0,1);
        }

        /* RESPONSIVE FOR MOBILE */
        @media (max-width: 650px) {
            .workspace-grid { grid-template-columns: 80px 1fr 200px; }
            .k { height: 48px; font-size: 18px; }
            .price-overlay { font-size: 28px; right: 210px; }
            .stop-item { font-size: 12px; }
        }
    </style>
</head>
<body>

<div id="occ-terminal">
    <div id="pwr-sensor" onclick="execBoot()">🍄</div>

    <div id="lcd-glass">
        
        <div id="boot-layer"></div>

        <div id="login-layer">
            <div class="login-header">Identifikace obsluhy</div>
            <div class="user-selector" id="u-sel">
                <div class="user-btn active" onclick="pickUser('driver', '10342')">Řidič</div>
                <div class="user-btn" onclick="pickUser('relief', '20551')">Střídač</div>
                <div class="user-btn" onclick="pickUser('checker', '99999')">Revizor</div>
                <div class="user-btn" onclick="pickUser('service', '11111')">Servis</div>
            </div>
            <div class="login-input-field" id="log-display">ID?</div>
            <div class="numpad-grid" style="grid-template-columns: repeat(3, 1fr); width: 280px; background: transparent">
                <button class="k" onclick="keyLog(1)">1</button><button class="k" onclick="keyLog(2)">2</button><button class="k" onclick="keyLog(3)">3</button>
                <button class="k" onclick="keyLog(4)">4</button><button class="k" onclick="keyLog(5)">5</button><button class="k" onclick="keyLog(6)">6</button>
                <button class="k" onclick="keyLog(7)">7</button><button class="k" onclick="keyLog(8)">8</button><button class="k" onclick="keyLog(9)">9</button>
                <button class="k alt" onclick="clearLog()">C</button><button class="k" onclick="keyLog(0)">0</button><button class="k go" onclick="submitLog()">OK</button>
            </div>
        </div>

        <div id="menu-layer">
            <h2 style="text-align:center; color:var(--syn-yellow); margin-bottom:15px">PARAMETRY SLUŽBY</h2>
            <div class="setup-row">
                <div class="setup-box selected" id="m-box-line" onclick="setMTarget('line')"><label>Linka</label><span id="v-m-line">790968</span></div>
                <div class="setup-box" id="m-box-spoj" onclick="setMTarget('spoj')"><label>Spoj</label><span id="v-m-spoj">2</span></div>
            </div>
            <div class="setup-row">
                <div class="setup-box" id="m-box-time" onclick="setMTarget('time')"><label>Odjezd (HHMM)</label><span id="v-m-time">1935</span></div>
                <div class="setup-box" id="m-box-stop" onclick="setMTarget('stop')"><label>Výchozí index</label><span id="v-m-stop">0</span></div>
            </div>
            <div style="flex:1"></div>
            <div class="numpad-grid">
                <button class="k" onclick="keyMenu(7)">7</button><button class="k" onclick="keyMenu(8)">8</button><button class="k" onclick="keyMenu(9)">9</button><button class="k alt" onclick="clearMenu()">C</button>
                <button class="k" onclick="keyMenu(4)">4</button><button class="k" onclick="keyMenu(5)">5</button><button class="k" onclick="keyMenu(6)">6</button><button class="k go" style="grid-row: span 2" onclick="saveMenu()">OK</button>
                <button class="k" onclick="keyMenu(1)">1</button><button class="k" onclick="keyMenu(2)">2</button><button class="k" onclick="keyMenu(3)">3</button>
                <button class="k" style="grid-column: span 2" onclick="keyMenu(0)">0</button><button class="k alt">.</button>
            </div>
        </div>

        <div id="app-layer">
            <div class="top-bar">
                <span id="h-ids" style="font-weight:bold; font-size:14px">790968 / 2</span>
                <span id="h-date" style="color:var(--syn-sky)">07.05.2026</span>
                <div id="h-delay" class="info-pill norm">+0 m</div>
                <span id="h-clock" style="font-size:18px">00:00:00</span>
            </div>

            <div class="workspace-grid">
                <div class="left-stats">
                    <div class="stat-unit"><label>ZÓNA</label><div id="s-zone">100</div></div>
                    <div class="stat-unit"><label>TARIF</label><div id="s-tarif">IDS JMK</div></div>
                    <div class="stat-unit"><label>UŽIVATEL</label><div id="s-user" style="font-size:9px">ŘIDIČ</div></div>
                    <div style="flex:1"></div>
                    <div class="stat-unit"><label>SÍŤ</label><div style="color:var(--syn-green)">4G OK</div></div>
                </div>

                <div class="stop-scroller" id="itinerary"></div>

                <div class="numpad-grid">
                    <button class="k alt">PŘES</button><button class="k" onclick="keyMain(7)">7</button><button class="k" onclick="keyMain(8)">8</button><button class="k" onclick="keyMain(9)">9</button>
                    <button class="k alt">MULT</button><button class="k" onclick="keyMain(4)">4</button><button class="k" onclick="keyMain(5)">5</button><button class="k" onclick="keyMain(6)">6</button>
                    <button class="k alt">KART</button><button class="k" onclick="keyMain(1)">1</button><button class="k" onclick="keyMain(2)">2</button><button class="k" onclick="keyMain(3)">3</button>
                    <button class="k alt" onclick="clearMain()">STOR</button><button class="k" onclick="keyMain('.')">.</button><button class="k" onclick="keyMain(0)">0</button><button class="k alt">±</button>
                    <button class="k warn" style="grid-column: span 2" onclick="goNext()">DALŠÍ</button>
                    <button class="k go" style="grid-column: span 2" onclick="doSell()">OK</button>
                </div>
                
                <div class="price-overlay" id="v-price">11,00 Kč</div>
            </div>

            <div class="ticket-strip">
                <button class="t-btn menu" onclick="openMenu()">MENU</button>
                <button class="t-btn selected" onclick="pickT(this, 11)">Základní</button>
                <button class="t-btn" onclick="pickT(this, 5)">Dítě</button>
                <button class="t-btn" onclick="pickT(this, 8)">Student</button>
                <button class="t-btn" onclick="pickT(this, 8)">65+</button>
                <button class="t-btn" onclick="pickT(this, 0)">ZTP</button>
                <button class="t-btn" onclick="pickT(this, 7)">Pes</button>
                <button class="t-btn" onclick="pickT(this, 0)">Kočárek</button>
                <button class="t-btn" onclick="pickT(this, 0)">Zavaz.</button>
                <button class="t-btn exit" onclick="location.reload()">KONEC</button>
            </div>
        </div>

    </div>
</div>

<audio id="snd-gong" src="gong.mp3" preload="auto"></audio>

<script>
    /* --- SYNERGY OCC ENTERPRISE CORE LOGIC v10.0 --- */

    const REPOSITORY = {
        users: {
            driver: { id: "10342", pin: "3508", name: "ŘIDIČ" },
            relief: { id: "20551", pin: "1234", name: "STŘÍDAČ" },
            checker: { id: "99999", pin: "0000", name: "REVIZOR" },
            service: { id: "11111", pin: "8888", name: "SERVIS" }
        },
        stops: [
            {n: "Studená,,ul.1.máje a", t: "19:35"}, {n: "Studená,,H.Bolíko,roz", t: "19:38"},
            {n: "Mrákotín", t: "19:45"}, {n: "Krahulčí", t: "19:49"},
            {n: "Telč,,aut.nádr.", t: "19:59"}, {n: "Telč,,Interiér", t: "20:01"},
            {n: "Dyjice,Dolní Dvorce", t: "20:03"}, {n: "Radkov", t: "20:08"},
            {n: "Slaviboř", t: "20:12"}, {n: "Černíč", t: "20:15"},
            {n: "Kostelní Myslová", t: "20:20"}, {n: "Telč,,náměstí", t: "20:25"},
            {n: "Telč,,u hřbitova", t: "20:28"}, {n: "Třešť,,aut.st.", t: "20:45"}
        ]
    };

    let state = {
        isLive: false,
        uRole: 'driver',
        uTargetID: '10342',
        logStep: 1, // 1:ID, 2:PIN
        logBuf: "",
        mTarget: 'line',
        line: "790968",
        spoj: "2",
        time: "1935",
        idx: 0,
        price: 11,
        mainBuf: ""
    };

    // 1. BOOT SEQUENCE (20 ACTIONS)
    function execBoot() {
        if(state.isLive) return;
        const screen = document.getElementById('boot-layer');
        screen.style.display = 'block';

        const gong = document.getElementById('snd-gong');
        gong.play().then(() => gong.pause()).catch(() => {});

        const logs = [
            "Synergy Kernel v10.0.1 (Enterprise Edition) starting...",
            "Checking Hardware Integrity... [OK]",
            "Memory Test: 4096MB LPDDR4... [OK]",
            "Storage: 32GB eMMC mounting /root... [OK]",
            "Networking: LTE/5G module initialization...",
            "Carrier: O2 CZ - Signal Strength: -88dBm (Excellent)",
            "GPS/Galileo: Synchronizing high-precision clock...",
            "GPS: Fixed. Coordinates: 49.191N, 15.452E",
            "VDV-KA: Loading secure smartcard libraries...",
            "Printer: P7-Thermal engine check... [ONLINE]",
            "NFC: ISO14443 reader calibration... [OK]",
            "Security: Initializing AES-256 session encryption...",
            "Database: Local stop repository sync (14,288 entries)...",
            "UserMgr: Loading multi-user profile definitions...",
            "Display: GPU Mali-G71 initialization...",
            "UI: Synergy CSS-Occ Engine loading assets...",
            "UI: Viewport 100vw/100vh calibration...",
            "Service: Remote Dispatcher Handshake... [SUCCESS]",
            "System: All subsystems operational.",
            "BOOT COMPLETE. Waiting for user login."
        ];

        let i = 0;
        const timer = setInterval(() => {
            screen.innerHTML += `<div><span style="color:#555">[${new Date().toLocaleTimeString()}]</span> ${logs[i]}</div>`;
            screen.scrollTop = screen.scrollHeight;
            i++;
            if(i >= logs.length) {
                clearInterval(timer);
                setTimeout(() => {
                    screen.style.display = 'none';
                    document.getElementById('login-layer').style.display = 'flex';
                }, 800);
            }
        }, 110);
    }

    // 2. MULTI-USER LOGIN
    function pickUser(role, id) {
        state.uRole = role;
        state.uTargetID = id;
        document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        state.logStep = 1;
        clearLog();
    }

    function keyLog(n) { state.logBuf += n; updLog(); }
    function clearLog() { state.logBuf = ""; updLog(); }
    function updLog() {
        const d = document.getElementById('log-display');
        if(state.logStep === 1) d.innerText = state.logBuf || "ID?";
        else d.innerText = "*".repeat(state.logBuf.length) || "PIN?";
    }

    function submitLog() {
        const user = REPOSITORY.users[state.uRole];
        if(state.logStep === 1) {
            if(state.logBuf === user.id) {
                state.logStep = 2; state.logBuf = "";
                document.getElementById('login-header').innerText = "Zadejte PIN (" + user.pin + ")";
                updLog();
            } else { alert("Chybné ID!"); clearLog(); }
        } else {
            if(state.logBuf === user.pin) {
                document.getElementById('login-layer').style.display = 'none';
                document.getElementById('app-layer').style.display = 'flex';
                document.getElementById('s-user').innerText = user.name;
                state.isLive = true;
                runSystem();
            } else { alert("Špatný PIN!"); clearLog(); }
        }
    }

    // 3. MENU SYSTEM
    function openMenu() {
        document.getElementById('menu-layer').style.display = 'flex';
        setMTarget('line');
    }
    function setMTarget(t) {
        state.mTarget = t;
        document.querySelectorAll('.setup-box').forEach(b => b.classList.remove('selected'));
        document.getElementById(`m-box-${t}`).classList.add('selected');
    }
    function keyMenu(n) {
        let el = document.getElementById(`v-m-${state.mTarget}`);
        el.innerText = (el.innerText === "0" || el.innerText === "1935") ? n : el.innerText + n;
    }
    function clearMenu() { document.getElementById(`v-m-${state.mTarget}`).innerText = ""; }
    function saveMenu() {
        state.line = document.getElementById('v-m-line').innerText;
        state.spoj = document.getElementById('v-m-spoj').innerText;
        state.time = document.getElementById('v-m-time').innerText;
        state.idx = parseInt(document.getElementById('v-m-stop').innerText) || 0;
        
        if(state.time.length === 4) {
            REPOSITORY.stops[0].t = state.time.substring(0,2) + ":" + state.time.substring(2,4);
        }

        document.getElementById('menu-layer').style.display = 'none';
        document.getElementById('h-ids').innerText = `${state.line} / ${state.spoj}`;
        renderItinerary();
    }

    // 4. MAIN APPLICATION
    function runSystem() {
        renderItinerary();
        setInterval(onTick, 1000);
    }

    function onTick() {
        const now = new Date();
        document.getElementById('h-clock').innerText = now.toLocaleTimeString('cs-CZ');
        
        const plan = REPOSITORY.stops[state.idx].t.split(':');
        const pDate = new Date();
        pDate.setHours(plan[0], plan[1], 0);
        
        const diff = Math.floor((now - pDate) / 60000);
        const dTag = document.getElementById('h-delay');
        dTag.innerText = (diff >= 0 ? "+" : "") + diff + " m";
        dTag.className = `info-pill ${diff > 0 ? 'red' : 'norm'}`;
    }

    function renderItinerary() {
        const box = document.getElementById('itinerary');
        box.innerHTML = '';
        REPOSITORY.stops.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = `stop-item ${i === state.idx ? 'active' : ''} ${i < state.idx ? 'past' : ''}`;
            row.innerHTML = `<div>${s.t}</div><div style="font-size:9px; color:#999">21 |</div><div>${s.n}</div>`;
            box.appendChild(row);
        });
        const active = box.querySelector('.active');
        if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function keyMain(n) { state.mainBuf += n; }
    function clearMain() { state.mainBuf = ""; }

    function goNext() {
        if(state.idx < REPOSITORY.stops.length - 1) {
            state.idx++;
            renderItinerary();
            const g = document.getElementById('snd-gong');
            g.currentTime = 0;
            g.play().catch(() => {});
        }
    }

    function pickT(btn, p) {
        document.querySelectorAll('.t-btn').forEach(k => k.classList.remove('selected'));
        btn.classList.add('selected');
        state.price = p;
        document.getElementById('v-price').innerText = p.toFixed(2).replace('.', ',') + " Kč";
    }

    function doSell() {
        alert("SYNERGY TICKET\n----------------\nLinka: " + state.line + "\nCena: " + state.price + " Kč\nUživatel: " + state.uRole);
    }
</script>
</body>
</html>
