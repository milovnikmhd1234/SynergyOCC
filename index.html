<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synergy OCC Ultimate Enterprise Edition v12.0</title>
    <style>
        :root {
            /* Barevná schémata dopravců */
            --syn-blue: #004b93;
            --syn-orange: #f39200;
            --syn-green: #4db748;
            --syn-red: #cc0000;
            --idsjmk-color: #f39200;
            --pid-color: #e30613;
            --zgroup-color: #003399;
            
            /* UI barvy */
            --bg-dark: #0a0a0a;
            --bg-panel: #1a1a1a;
            --text-main: #ffffff;
            --text-dim: #888888;
            --gold: #ffcc00;
            --glass: rgba(255, 255, 255, 0.1);
        }

        /* Globální reset */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Hlavní kontejner - Šasi terminálu */
        #terminal-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #222, #000);
            border: 8px solid #111;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        /* Displej s efektem skla */
        #lcd-screen {
            flex: 1;
            margin: 4px;
            background: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid #333;
        }

        /* 1. BOOT SEKCE - Animované logování */
        #boot-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 10000;
            padding: 30px;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            overflow-y: auto;
            display: none;
        }

        .boot-line { margin-bottom: 2px; }
        .boot-ts { color: #555; margin-right: 10px; }

        /* 2. LOGIN SEKCE */
        #login-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, #222, #000);
            z-index: 9000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--bg-panel);
            padding: 25px;
            border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }

        .login-display {
            background: #000;
            color: var(--gold);
            font-size: 32px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #555;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }

        /* 3. MENU - KONFIGURACE SYSTÉMU */
        #menu-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #001529;
            z-index: 8500;
            display: none;
            flex-direction: column;
            padding: 20px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .config-item {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--syn-sky);
            padding: 15px;
            text-align: center;
            border-radius: 4px;
        }

        .config-item.active {
            border: 2px solid var(--gold);
            background: rgba(255, 204, 0, 0.1);
        }

        .config-item label { display: block; font-size: 10px; color: #aaa; text-transform: uppercase; margin-bottom: 5px; }
        .config-item span { font-size: 18px; font-weight: bold; color: var(--gold); }

        /* 4. HLAVNÍ KASA - OPTIMALIZOVANÝ LAYOUT */
        #main-app-layer {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .status-bar {
            height: 35px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 13px;
            border-bottom: 1px solid #333;
        }

        .delay-indicator {
            padding: 2px 10px;
            border-radius: 3px;
            font-weight: bold;
        }
        .delay-ok { background: #444; }
        .delay-warn { background: var(--syn-red); }

        /* PRACOVNÍ PLOCHA - ZDE JE KASA A KLÁVESNICE */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 200px; /* Zmenšená šířka klávesnice */
            gap: 1px;
            background: #333;
            overflow: hidden;
        }

        /* SEZNAM ZASTÁVEK (KASA) */
        .stop-itinerary {
            background: #fff;
            color: #000;
            overflow-y: auto;
            position: relative;
        }

        .stop-row {
            display: grid;
            grid-template-columns: 60px 40px 1fr;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            align-items: center;
        }

        .stop-row.active {
            background: var(--syn-orange);
            color: #fff;
            font-weight: bold;
            border-left: 6px solid var(--syn-blue);
        }

        .stop-row.passed {
            background: #f9f9f9;
            color: #ccc;
        }

        /* NUMERICKÝ BLOK (KOMPAKTNÍ) */
        .numpad-container {
            background: #222;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            padding: 1px;
        }

        .key {
            background: #333;
            color: #fff;
            border: none;
            font-size: 20px;
            font-weight: bold;
            height: 50px; /* Menší výška pro lepší přehlednost */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .key:active { background: #555; }
        .key.blue { background: var(--syn-blue); }
        .key.orange { background: var(--syn-orange); }
        .key.green { background: var(--syn-green); }
        .key.wide { grid-column: span 2; }
        .key.tall { grid-row: span 2; height: 101px; }
        .key.small { font-size: 11px; color: #aaa; }

        /* CENA A JÍZDENKY */
        .ticket-footer {
            height: 110px;
            background: #000;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
            padding: 2px;
        }

        .t-btn {
            background: var(--syn-blue);
            color: #fff;
            border: none;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .t-btn.active { background: var(--gold); color: #000; }
        .t-btn.sys { background: #333; color: var(--gold); }

        .price-overlay {
            position: absolute;
            bottom: 115px;
            right: 210px;
            font-size: 32px;
            font-weight: 900;
            color: var(--syn-red);
            text-shadow: 2px 2px 0 #fff;
            pointer-events: none;
            z-index: 50;
        }

        /* 🍄 POWER BUTTON */
        #mushroom-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #444, #111);
            border: 3px solid #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            z-index: 11000;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        #mushroom-btn:active { transform: scale(0.95); }

    </style>
</head>
<body>

<div id="terminal-container">
    <div id="mushroom-btn" onclick="startBootSequence()">🍄</div>

    <div id="lcd-screen">
        
        <div id="boot-layer"></div>

        <div id="login-layer">
            <div class="login-card">
                <div id="login-title" style="margin-bottom:10px; font-size:12px; color:#aaa">SYNERGY SECURITY - ZADEJTE ID</div>
                <div class="login-display" id="log-val">ID?</div>
                <div class="numpad-container">
                    <button class="key" onclick="keyL(1)">1</button><button class="key" onclick="keyL(2)">2</button><button class="key" onclick="keyL(3)">3</button>
                    <button class="key" onclick="keyL(4)">4</button><button class="key" onclick="keyL(5)">5</button><button class="key" onclick="keyL(6)">6</button>
                    <button class="key" onclick="keyL(7)">7</button><button class="key" onclick="keyL(8)">8</button><button class="key" onclick="keyL(9)">9</button>
                    <button class="key small" onclick="clearL()">STORNO</button><button class="key" onclick="keyL(0)">0</button><button class="key green" onclick="submitL()">OK</button>
                </div>
            </div>
        </div>

        <div id="menu-layer">
            <h2 style="text-align:center; color:var(--gold); margin-bottom:20px;">SYSTÉMOVÉ MENU</h2>
            <div class="config-grid">
                <div class="config-item active" id="m-line" onclick="setMT('line')">
                    <label>Linka</label><span id="val-m-line">790968</span>
                </div>
                <div class="config-item" id="m-spoj" onclick="setMT('spoj')">
                    <label>Spoj</label><span id="val-m-spoj">2</span>
                </div>
                <div class="config-item" id="m-carrier" onclick="toggleCarrier()">
                    <label>Dopravce</label><span id="val-m-carrier">IDSJMK</span>
                </div>
                <div class="config-item" id="m-start" onclick="setMT('start')">
                    <label>Index zastávky</label><span id="val-m-start">0</span>
                </div>
            </div>
            <div style="flex:1"></div>
            <div class="numpad-container" style="max-width: 400px; margin: 0 auto;">
                <button class="key" onclick="keyM(7)">7</button><button class="key" onclick="keyM(8)">8</button><button class="key" onclick="keyM(9)">9</button><button class="key small" onclick="clearM()">CLEAR</button>
                <button class="key" onclick="keyM(4)">4</button><button class="key" onclick="keyM(5)">5</button><button class="key" onclick="keyM(6)">6</button><button class="key green tall" onclick="saveMenu()">OK</button>
                <button class="key" onclick="keyM(1)">1</button><button class="key" onclick="keyM(2)">2</button><button class="key" onclick="keyM(3)">3</button>
                <button class="key wide" onclick="keyM(0)">0</button><button class="key">.</button>
            </div>
        </div>

        <div id="main-app-layer">
            <div class="status-bar">
                <span id="st-ids">790968 / 2</span>
                <span id="st-carrier" style="color:var(--syn-orange)">IDSJMK</span>
                <div id="st-delay" class="delay-indicator delay-ok">+0 min</div>
                <span id="st-clock">00:00:00</span>
            </div>

            <div class="workspace">
                <div class="stop-itinerary" id="itinerary-box">
                    </div>

                <div class="numpad-container">
                    <button class="key small">ZÓNA</button>
                    <button class="key" onclick="keyA(7)">7</button>
                    <button class="key" onclick="keyA(8)">8</button>
                    <button class="key" onclick="keyA(9)">9</button>
                    <button class="key small">TARIF</button>
                    <button class="key" onclick="keyA(4)">4</button>
                    <button class="key" onclick="keyA(5)">5</button>
                    <button class="key" onclick="keyA(6)">6</button>
                    <button class="key small">KARTA</button>
                    <button class="key" onclick="keyA(1)">1</button>
                    <button class="key" onclick="keyA(2)">2</button>
                    <button class="key" onclick="keyA(3)">3</button>
                    <button class="key small" onclick="clearA()">STORNO</button>
                    <button class="key" onclick="keyA(0)">0</button>
                    <button class="key orange tall" onclick="nextStop()">DALŠÍ</button>
                    <button class="key green wide" onclick="doSale()">POTVRDIT (OK)</button>
                </div>
            </div>

            <div class="price-overlay" id="pr-val">11,00 Kč</div>

            <div class="ticket-footer">
                <button class="t-btn sys" onclick="openMenu()">MENU</button>
                <button class="t-btn active" onclick="setCat(this, 11)">Základní</button>
                <button class="t-btn" onclick="setCat(this, 5)">Dítě</button>
                <button class="t-btn" onclick="setCat(this, 8)">Student</button>
                <button class="t-btn" onclick="setCat(this, 8)">Senior</button>
                <button class="t-btn" onclick="setCat(this, 0)">ZTP</button>
                <button class="t-btn" onclick="setCat(this, 7)">Pes</button>
                <button class="t-btn" onclick="setCat(this, 0)">Kočárek</button>
                <button class="t-btn" onclick="setCat(this, 15)">Zavazad.</button>
                <button class="t-btn sys" style="background:var(--syn-red); color:#fff" onclick="location.reload()">OFF</button>
            </div>
        </div>

    </div>
</div>

<audio id="snd-gong" src="gong.mp3" preload="auto"></audio>

<script>
    /**
     * SYNERGY OCC CORE ENGINE v12.0
     * Obsahuje veškerou logiku pro správu dat, uživatelů a stavu terminálu.
     */

    const DATA = {
        stops: [
            {n: "Brno,,Úan Zvonařka", t: "14:10", z: "100"},
            {n: "Brno,,Ústřední hřbitov", t: "14:18", z: "101"},
            {n: "Modřice,,u hřbitova", t: "14:25", z: "510"},
            {n: "Rajhrad,,u kláštera", t: "14:32", z: "510"},
            {n: "Holasice", t: "14:35", z: "520"},
            {n: "Vojkovice", t: "14:38", z: "520"},
            {n: "Židlochovice,,nám.", t: "14:45", z: "525"},
            {n: "Hrušovany u Brna", t: "14:52", z: "525"},
            {n: "Pohořelice,,u parku", t: "15:05", z: "610"},
            {n: "Ivaň,,náves", t: "15:15", z: "620"},
            {n: "Pasohlávky,,u kostela", t: "15:22", z: "620"},
            {n: "Mikulov,,u parku", t: "15:40", z: "630"}
        ],
        carriers: ["IDSJMK", "Z-Group bus", "PID", "ČSAD"],
        users: { id: "10342", pin: "3508" }
    };

    let state = {
        power: false,
        logStep: 1, // 1: ID, 2: PIN
        logBuf: "",
        mTarget: 'line',
        cIdx: 0,
        // Aktuální nastavení terminálu
        line: "790968",
        spoj: "2",
        idx: 0,
        price: 11,
        mainBuf: ""
    };

    // --- 1. BOOT SEKCE ---
    function startBootSequence() {
        if(state.power) return;
        const b = document.getElementById('boot-layer');
        b.style.display = 'block';

        // Unlock audio
        const g = document.getElementById('snd-gong');
        g.play().then(() => g.pause()).catch(() => {});

        const logs = [
            "Synergy BIOS v8.4.1 checking hardware...",
            "CPU: ARM Cortex-A53 (Quad-Core) OK",
            "RAM: 2048MB testing... OK",
            "Storage: eMMC 16GB mount /system... OK",
            "Net: LTE/5G Module initializing...",
            "Carrier: O2-CZ signal -72dBm... Connected",
            "GPS: Validating GNSS fix...",
            "GPS: Location acquired 49.194N 16.608E",
            "Peripheral: Printer P7-Thermal... ONLINE",
            "Peripheral: NFC Reader VDV... READY",
            "Kernel: Synergy RTOS 12.0 loading...",
            "Database: Stops v24.05 sync... OK",
            "Security: AES-256 Module active",
            "GUI: Loading Synergy Shell...",
            "SYSTEM READY."
        ];

        let i = 0;
        const timer = setInterval(() => {
            const line = document.createElement('div');
            line.className = 'boot-line';
            line.innerHTML = `<span class="boot-ts">[${new Date().toLocaleTimeString()}]</span> ${logs[i]}`;
            b.appendChild(line);
            b.scrollTop = b.scrollHeight;
            i++;
            if(i >= logs.length) {
                clearInterval(timer);
                setTimeout(() => {
                    b.style.display = 'none';
                    document.getElementById('login-layer').style.display = 'flex';
                }, 800);
            }
        }, 110);
    }

    // --- 2. LOGIN SEKCE ---
    function keyL(n) { state.logBuf += n; updL(); }
    function clearL() { state.logBuf = ""; updL(); }
    function updL() {
        const d = document.getElementById('log-val');
        const t = document.getElementById('login-title');
        if(state.logStep === 1) {
            d.innerText = state.logBuf || "ID?";
            t.innerText = "SYNERGY SECURITY - ZADEJTE ID (10342)";
        } else {
            d.innerText = "*".repeat(state.logBuf.length) || "PIN?";
            t.innerText = "SYNERGY SECURITY - ZADEJTE PIN (3508)";
        }
    }
    function submitL() {
        if(state.logStep === 1) {
            if(state.logBuf === DATA.users.id) {
                state.logStep = 2; state.logBuf = ""; updL();
            } else { alert("Neznámé ID!"); clearL(); }
        } else {
            if(state.logBuf === DATA.users.pin) {
                document.getElementById('login-layer').style.display = 'none';
                document.getElementById('main-app-layer').style.display = 'flex';
                state.power = true;
                initMain();
            } else { alert("Chybné PIN!"); clearL(); }
        }
    }

    // --- 3. MENU SEKCE ---
    function openMenu() {
        document.getElementById('menu-layer').style.display = 'flex';
        setMT('line');
    }

    function setMT(t) {
        state.mTarget = t;
        document.querySelectorAll('.config-item').forEach(i => i.classList.remove('active'));
        document.getElementById(`m-${t}`).classList.add('active');
    }

    function keyM(n) {
        let el = document.getElementById(`val-m-${state.mTarget}`);
        el.innerText = (el.innerText === "0" || el.innerText === "790968") ? n : el.innerText + n;
    }

    function clearM() { document.getElementById(`val-m-${state.mTarget}`).innerText = ""; }

    function toggleCarrier() {
        state.cIdx = (state.cIdx + 1) % DATA.carriers.length;
        document.getElementById('val-m-carrier').innerText = DATA.carriers[state.cIdx];
    }

    function saveMenu() {
        state.line = document.getElementById('val-m-line').innerText;
        state.spoj = document.getElementById('val-m-spoj').innerText;
        state.idx = parseInt(document.getElementById('val-m-start').innerText) || 0;
        
        // Update UI
        document.getElementById('st-ids').innerText = `${state.line} / ${state.spoj}`;
        document.getElementById('st-carrier').innerText = DATA.carriers[state.cIdx];
        
        renderItinerary();
        document.getElementById('menu-layer').style.display = 'none';
    }

    // --- 4. HLAVNÍ KASA ---
    function initMain() {
        renderItinerary();
        setInterval(tick, 1000);
    }

    function tick() {
        const now = new Date();
        document.getElementById('st-clock').innerText = now.toLocaleTimeString('cs-CZ');
        
        // Delay Logic
        const p = DATA.stops[state.idx].t.split(':');
        const pDate = new Date();
        pDate.setHours(p[0], p[1], 0);
        
        const diff = Math.floor((now - pDate) / 60000);
        const el = document.getElementById('st-delay');
        el.innerText = (diff >= 0 ? "+" : "") + diff + " min";
        el.className = `delay-indicator ${diff > 0 ? 'delay-warn' : 'delay-ok'}`;
    }

    function renderItinerary() {
        const box = document.getElementById('itinerary-box');
        box.innerHTML = "";
        DATA.stops.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = `stop-row ${i === state.idx ? 'active' : ''} ${i < state.idx ? 'passed' : ''}`;
            row.innerHTML = `<div>${s.t}</div><div style="color:#888; font-size:10px">${s.z} |</div><div>${s.n}</div>`;
            box.appendChild(row);
        });
        const active = box.querySelector('.active');
        if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function keyA(n) { state.mainBuf += n; }
    function clearA() { state.mainBuf = ""; }

    function nextStop() {
        if(state.idx < DATA.stops.length - 1) {
            state.idx++;
            renderItinerary();
            const g = document.getElementById('snd-gong');
            g.currentTime = 0;
            g.play().catch(()=>{});
        }
    }

    function setCat(btn, p) {
        document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.price = p;
        document.getElementById('pr-val').innerText = p.toFixed(2).replace('.', ',') + " Kč";
    }

    function doSale() {
        alert("JÍZDENKA SYNERGY\n----------------\nDopravce: " + DATA.carriers[state.cIdx] + "\nLinka: " + state.line + "\nCena: " + state.price + " Kč\n----------------\nŠťastnou cestu!");
    }

    /** * KONEC KÓDU - SYNERGY OCC ENTERPRISE
     * Tento soubor obsahuje 720+ řádků (včetně stylů a logiky).
     */
</script>
</body>
</html>
