<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Synergy OCC - Autentický Simulátor</title>
    <style>
        :root {
            --synergy-green: #006b3f;
            --synergy-light: #00a859;
            --lcd-bg: #050505;
            --text: #ffffff;
        }

        body {
            background: #121212;
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        /* Fyzický rám tabletu */
        #tablet-frame {
            width: 850px;
            height: 520px;
            background: #333;
            border-radius: 20px;
            padding: 25px;
            box-shadow: inset 0 0 50px #000, 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
            border: 4px solid #444;
        }

        /* Obrazovka */
        #screen {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            position: relative;
            border: 2px solid #111;
        }

        /* Stav vypnutí */
        #power-off-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Horní lišta */
        .status-bar {
            background: var(--synergy-green);
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Obsah */
        .content {
            padding: 20px;
            height: calc(100% - 100px);
            display: none;
        }

        .active { display: block; }

        /* Tlačítka */
        .btn-main {
            background: var(--synergy-green);
            border: 2px solid var(--synergy-light);
            color: white;
            padding: 15px;
            margin: 10px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            transition: 0.2s;
        }

        .btn-main:active { transform: scale(0.95); background: var(--synergy-light); }

        /* Tlačítko Zapnutí 🍄 */
        #power-btn {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 60px;
            height: 60px;
            background: #222;
            border: 2px solid #444;
            border-radius: 50%;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 101;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #power-btn:active { background: #333; }

        /* Tabulka zastávek */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: var(--synergy-light); font-size: 12px; }
        td { padding: 10px 0; border-bottom: 1px solid #222; }
        .current-stop { color: var(--synergy-light); font-weight: bold; background: rgba(0,168,89,0.1); }

        .login-box {
            width: 300px;
            margin: 50px auto;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #111;
            border: 1px solid var(--synergy-green);
            color: white;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="tablet-frame">
    <!-- Fyzické tlačítko zapnutí -->
    <div id="power-btn" onclick="togglePower()">🍄</div>

    <div id="screen">
        <!-- Černá obrazovka při vypnutí -->
        <div id="power-off-overlay">
            <div id="boot-text" style="color: #555; font-family: monospace; display: none;">SYNERGY BIOS v4.2... OK<br>LOADING OS... OK</div>
        </div>

        <!-- System UI -->
        <div class="status-bar">
            <span id="ui-driver-info">SYNERGY OCC</span>
            <span id="ui-clock">00:00:00</span>
        </div>

        <!-- Obrazovka Přihlášení -->
        <div id="scr-login" class="content active">
            <div class="login-box">
                <h2 style="color: var(--synergy-light)">PŘIHLÁŠENÍ</h2>
                <input type="text" id="id-input" placeholder="ID ŘIDIČE">
                <input type="password" id="pin-input" placeholder="PIN">
                <button class="btn-main" style="width: 100%" onclick="login()">PŘIHLÁSIT SE</button>
            </div>
        </div>

        <!-- Obrazovka Jízda -->
        <div id="scr-drive" class="content">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h1 id="route-title" style="margin:0">LINKA 125</h1>
                    <span id="route-direction" style="color: #aaa;">Směr: HLAVNÍ NÁDRAŽÍ</span>
                </div>
                <div style="text-align: right">
                    <div style="font-size: 24px; color: var(--synergy-light)">Zpoždění: <span id="delay">+0:30</span></div>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ZASTÁVKA</th>
                        <th>PŘÍJEZD</th>
                        <th>ODJEZD (JŘ)</th>
                    </tr>
                </thead>
                <tbody id="stop-table-body">
                    <!-- Generováno JS -->
                </tbody>
            </table>

            <div style="position: absolute; bottom: 20px; right: 20px;">
                <button class="btn-main" onclick="playGong()">GONG / HLÁŠENÍ</button>
                <button class="btn-main" onclick="nextStop()">DALŠÍ ZASTÁVKA</button>
            </div>
        </div>
    </div>
</div>

<audio id="sound-gong" src="gong.mp3"></audio>

<script>
    let isPoweredOn = false;
    const drivers = { 
        "001": { pin: "0000", name: "Test" }, 
        "002": { pin: "3508", name: "Petr Solaris" }, 
        "003": { pin: "9910", name: "Host" } 
    };

    const route = [
        { name: "Sídliště Barrandov", dep: "14:05" },
        { name: "Geologická", dep: "14:08" },
        { name: "Lihovar", dep: "14:12" },
        { name: "Smíchovské nádr.", dep: "14:16" },
        { name: "Anděl", dep: "14:20" }
    ];
    let stopIdx = 0;

    function togglePower() {
        const overlay = document.getElementById('power-off-overlay');
        const bootText = document.getElementById('boot-text');
        
        if (!isPoweredOn) {
            bootText.style.display = "block";
            setTimeout(() => {
                overlay.style.display = "none";
                isPoweredOn = true;
            }, 1500);
        } else {
            overlay.style.display = "flex";
            bootText.style.display = "none";
            isPoweredOn = false;
            location.reload(); // Reset systému
        }
    }

    function login() {
        const id = document.getElementById('id-input').value;
        const pin = document.getElementById('pin-input').value;
        if (drivers[id] && drivers[id].pin === pin) {
            document.getElementById('ui-driver-info').innerText = `Řidič: ${drivers[id].name}`;
            showScr('scr-drive');
            renderStops();
        } else {
            alert("Neplatné ID nebo PIN!");
        }
    }

    function renderStops() {
        const tbody = document.getElementById('stop-table-body');
        tbody.innerHTML = "";
        route.forEach((s, i) => {
            const row = document.createElement('tr');
            if (i === stopIdx) row.className = "current-stop";
            row.innerHTML = `<td>${s.name}</td><td>${s.dep}</td><td>${s.dep}</td>`;
            tbody.appendChild(row);
        });
    }

    function nextStop() {
        if (stopIdx < route.length - 1) {
            stopIdx++;
            renderStops();
            playGong();
        }
    }

    function playGong() {
        const a = document.getElementById('sound-gong');
        a.play().catch(() => console.log("Gong.mp3 nenalezen."));
    }

    function showScr(id) {
        document.querySelectorAll('.content').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    setInterval(() => {
        document.getElementById('ui-clock').innerText = new Date().toLocaleTimeString('cs-CZ');
    }, 1000);
</script>

</body>
</html>
