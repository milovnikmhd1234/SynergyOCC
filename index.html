<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synergy OCC Custom v14.0</title>
    <style>
        :root {
            --syn-blue: #004b93;
            --syn-orange: #f39200;
            --syn-green: #4db748;
            --syn-red: #cc0000;
            --syn-dark: #000a16;
            --gold: #ffcc00;
            --white: #ffffff;
            --panel-bg: #151515;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: #000; height: 100vh; width: 100vw; display: flex; overflow: hidden; color: var(--white); }

        #main-shell { width: 100%; height: 100%; background: #222; border: 5px solid #111; display: flex; flex-direction: column; position: relative; }
        #screen { flex: 1; margin: 2px; background: #000; position: relative; overflow: hidden; display: flex; flex-direction: column; }

        /* --- BOOT LAYER --- */
        #layer-boot { position: absolute; top:0; left:0; width:100%; height:100%; background:#000; z-index:10000; padding:20px; color:#00ff00; font-family:monospace; font-size:11px; overflow-y:auto; display:none; }
        .boot-row { margin-bottom: 2px; }

        /* --- LOGIN LAYER --- */
        #layer-login { position: absolute; top:0; left:0; width:100%; height:100%; background:radial-gradient(circle, #222, #000); z-index:9000; display:none; flex-direction:column; align-items:center; justify-content:center; }
        .login-box { background: var(--panel-bg); padding: 25px; border: 1px solid #333; width: 320px; text-align: center; }
        .login-lcd { background:#000; color:var(--gold); font-size:32px; height:60px; line-height:60px; border:2px solid #444; margin-bottom:15px; letter-spacing:4px; font-weight:bold; }

        /* --- MENU LAYER (EDITOR) --- */
        #layer-menu { position: absolute; top:0; left:0; width:100%; height:100%; background:var(--syn-dark); z-index:8500; display:none; flex-direction:column; padding:15px; overflow-y: auto; }
        .menu-header { color: var(--gold); text-align: center; margin-bottom: 15px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .config-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--syn-blue); padding: 10px; text-align: center; }
        .config-btn.active { border: 2px solid var(--gold); background: rgba(255, 204, 0, 0.1); }
        .config-btn label { display: block; font-size: 9px; color: #888; text-transform: uppercase; }
        .config-btn b { font-size: 14px; color: var(--gold); }

        /* EDITOR VLASTNÍ TRASY */
        .editor-section { background: #000; border: 1px solid #333; padding: 10px; margin-bottom: 15px; }
        .editor-row { display: grid; grid-template-columns: 1fr 60px 40px; gap: 5px; margin-bottom: 5px; font-size: 11px; align-items: center; border-bottom: 1px solid #222; padding: 4px 0; }
        .editor-input { background: #111; border: 1px solid #444; color: #fff; padding: 4px; font-size: 12px; }

        /* --- APP LAYER --- */
        #layer-app { display: none; flex-direction: column; height: 100%; }
        .top-info { height: 35px; background: #000; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-size: 13px; border-bottom: 1px solid #333; }
        
        .main-container { flex: 1; display: grid; grid-template-columns: 1fr 170px; background: #333; gap: 1px; overflow: hidden; }
        .itinerary { background: #fff; color: #000; overflow-y: auto; position: relative; }
        .stop-row { display: grid; grid-template-columns: 50px 30px 1fr; padding: 12px 10px; border-bottom: 1px solid #eee; font-size: 13px; align-items: center; }
        .stop-row.active { background: var(--syn-orange); color: #fff; font-weight: bold; border-left: 5px solid var(--syn-blue); }
        .stop-row.passed { color: #bbb; background: #f9f9f9; }

        /* SPECIÁLNÍ OBRAZOVKY */
        #special-overlay { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 8000; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
        .pause-bg { background: linear-gradient(45deg, #001021, #000); }
        .service-bg { background: repeating-linear-gradient(45deg, #000, #000 10px, #111 10px, #111 20px); }
        .special-title { font-size: 42px; font-weight: 900; color: var(--gold); text-transform: uppercase; margin-bottom: 20px; }

        /* KLÁVESNICE */
        .numpad { background: #1a1a1a; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding: 1px; }
        .key { background: #333; color: #fff; border: none; font-size: 20px; font-weight: bold; height: 50px; display: flex; justify-content: center; align-items: center; }
        .key:active { background: #555; }
        .key.orange { background: var(--syn-orange); }
        .key.green { background: var(--syn-green); }
        .key.blue { background: var(--syn-blue); }
        .key.wide { grid-column: span 2; }
        .key.tall { grid-row: span 2; height: 101px; }
        .key.small { font-size: 10px; color: #aaa; text-transform: uppercase; }

        /* JÍZDENKY */
        .ticket-bar { height: 100px; background: #000; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr 1fr; gap: 1px; padding: 2px; }
        .t-btn { background: var(--syn-blue); color: #fff; border: none; font-size: 9px; font-weight: bold; text-transform: uppercase; }
        .t-btn.active { background: var(--gold); color: #000; }
        .t-btn.sys { background: #222; color: var(--gold); }

        .price-overlay { position: absolute; bottom: 105px; right: 180px; font-size: 30px; font-weight: 900; color: var(--syn-red); text-shadow: 2px 2px 0 #fff; pointer-events: none; z-index: 100; }

        /* 🍄 POWER MUSHROOM */
        #power-btn { position: absolute; bottom: 15px; left: 15px; width: 55px; height: 55px; background: #333; border-radius: 50%; z-index: 11000; display: flex; justify-content: center; align-items: center; font-size: 28px; border: 3px solid #444; cursor: pointer; }
    </style>
</head>
<body>

<div id="main-shell">
    <div id="power-btn" onclick="startSystem()">🍄</div>

    <div id="screen">
        <div id="layer-boot"></div>

        <div id="layer-login">
            <div class="login-box">
                <div id="log-msg" style="margin-bottom:10px; font-size:11px; color:#aaa">ZADEJTE OSOBNÍ ID</div>
                <div class="login-lcd" id="log-disp">ID?</div>
                <div class="numpad" style="background:transparent">
                    <button class="key" onclick="kL(1)">1</button><button class="key" onclick="kL(2)">2</button><button class="key" onclick="kL(3)">3</button>
                    <button class="key" onclick="kL(4)">4</button><button class="key" onclick="kL(5)">5</button><button class="key" onclick="kL(6)">6</button>
                    <button class="key" onclick="kL(7)">7</button><button class="key" onclick="kL(8)">8</button><button class="key" onclick="kL(9)">9</button>
                    <button class="key small" onclick="clearL()">C</button><button class="key" onclick="kL(0)">0</button><button class="key green" onclick="submitL()">OK</button>
                </div>
            </div>
        </div>

        <div id="layer-menu">
            <div class="menu-header">SYSTÉMOVÁ KONFIGURACE</div>
            <div class="config-grid">
                <div class="config-btn active" id="m-line" onclick="setMT('line')"><label>Linka</label><b id="val-m-line">790968</b></div>
                <div class="config-btn" id="m-spoj" onclick="setMT('spoj')"><label>Spoj</label><b id="val-m-spoj">2</b></div>
            </div>

            <div class="editor-section">
                <div style="font-size:10px; color:var(--gold); margin-bottom:8px">EDITOR VLASTNÍ TRASY (Zastávka | Čas)</div>
                <div id="custom-stop-list">
                    </div>
                <button onclick="addCustomStop()" style="width:100%; margin-top:5px; padding:5px; background:var(--syn-green); border:none; color:#fff; font-size:10px; font-weight:bold">+ PŘIDAT ZASTÁVKU</button>
            </div>

            <div style="flex:1"></div>
            <div class="numpad" style="max-width:280px; margin: 0 auto">
                <button class="key" onclick="kM(7)">7</button><button class="key" onclick="kM(8)">8</button><button class="key" onclick="kM(9)">9</button>
                <button class="key" onclick="kM(4)">4</button><button class="key" onclick="kM(5)">5</button><button class="key" onclick="kM(6)">6</button>
                <button class="key" onclick="kM(1)">1</button><button class="key" onclick="kM(2)">2</button><button class="key" onclick="kM(3)">3</button>
                <button class="key small" onclick="clearM()">C</button><button class="key" onclick="kM(0)">0</button><button class="key green" onclick="saveMenu()">ULOŽIT</button>
            </div>
            <button onclick="closeMenu()" style="background:var(--syn-red); border:none; color:#fff; padding:8px; margin-top:10px; font-size:11px">ZRUŠIT</button>
        </div>

        <div id="layer-app">
            <div id="special-overlay">
                <div class="special-title" id="special-text">PAUZA</div>
                <div style="font-size:18px" id="special-sub">Čas odpočinku: <span id="p-timer">15:00</span></div>
                <button onclick="openMenu()" style="margin-top:40px; background:var(--syn-blue); border:none; color:#fff; padding:15px 30px">UKONČIT (MENU)</button>
            </div>

            <div class="top-info">
                <span id="st-ids">790968 / 2</span>
                <span id="st-mode">TRASA</span>
                <div id="st-delay" style="background:#444; padding:2px 8px; border-radius:3px">+0 m</div>
                <span id="st-clock">00:00:00</span>
            </div>

            <div class="main-container" id="app-main-area">
                <div class="itinerary" id="stop-itinerary"></div>
                <div class="numpad">
                    <button class="key small">ZÓNA</button><button class="key" onclick="kA(7)">7</button><button class="key" onclick="kA(8)">8</button><button class="key" onclick="kA(9)">9</button>
                    <button class="key small">TARIF</button><button class="key" onclick="kA(4)">4</button><button class="key" onclick="kA(5)">5</button><button class="key" onclick="kA(6)">6</button>
                    <button class="key small">KARTA</button><button class="key" onclick="kA(1)">1</button><button class="key" onclick="kA(2)">2</button><button class="key" onclick="kA(3)">3</button>
                    <button class="key small" onclick="clearA()">STOR</button><button class="key" onclick="kA(0)">0</button><button class="key orange tall" onclick="nextStop()">DALŠÍ</button>
                    <button class="key green wide" onclick="doSale()">OK</button>
                </div>
            </div>

            <div class="price-overlay" id="price-val">11,00 Kč</div>

            <div class="ticket-bar" id="app-ticket-bar">
                <button class="t-btn sys" onclick="openMenu()">MENU</button>
                <button class="t-btn active" onclick="pickT(this, 11)">Základní</button>
                <button class="t-btn" onclick="pickT(this, 5)">Dítě</button>
                <button class="t-btn" onclick="pickT(this, 8)">Student</button>
                <button class="t-btn" onclick="pickT(this, 8)">65+</button>
                <button class="t-btn" onclick="pickT(this, 0)">ZTP</button>
                <button class="t-btn" onclick="pickT(this, 7)">Pes</button>
                <button class="t-btn" onclick="pickT(this, 0)">Zavaz.</button>
                <button class="t-btn" onclick="pickT(this, 15)">Kolo</button>
                <button class="t-btn sys" style="background:var(--syn-red)" onclick="location.reload()">KONEC</button>
            </div>
        </div>
    </div>
</div>

<audio id="snd-gong" src="gong.mp3" preload="auto"></audio>

<script>
    /**
     * SYNERGY OCC CORE v14.0.2
     */

    const DB = {
        users: [
            {id: "10342", pin: "3508"}, {id: "20551", pin: "1234"},
            {id: "99999", pin: "0000"}, {id: "11111", pin: "8888"}, {id: "00001", pin: "9999"}
        ],
        defaultStops: [
            {n: "Brno,,Zvonařka", t: "12:00"}, {n: "Brno,,Hřbitov", t: "12:08"},
            {n: "Modřice", t: "12:15"}, {n: "Židlochovice", t: "12:30"}
        ]
    };

    let state = {
        booted: false, logStep: 1, logBuf: "",
        mTarget: 'line',
        line: "790968", spoj: "2",
        stops: JSON.parse(JSON.stringify(DB.defaultStops)),
        idx: 0, price: 11, mainBuf: ""
    };

    // --- BOOT ---
    function startSystem() {
        if(state.booted) return;
        const b = document.getElementById('layer-boot');
        b.style.display = 'block';
        const logs = [
            "Synergy Kernel v14.0 loading...", "Hardware Check: 0xFFA1 [OK]",
            "Memory Check: 4096MB [OK]", "LTE Module: Connected [O2-CZ]",
            "GPS Fix: Lat 49.19 N, Lon 16.60 E", "Loading Custom_Route_Engine...",
            "Validating Database IDs...", "GUI Initialized."
        ];
        let i = 0;
        const itv = setInterval(() => {
            b.innerHTML += `<div class="boot-row">[${new Date().toLocaleTimeString()}] ${logs[i]}</div>`;
            b.scrollTop = b.scrollHeight;
            i++;
            if(i >= logs.length) {
                clearInterval(itv);
                setTimeout(() => { b.style.display='none'; document.getElementById('layer-login').style.display='flex'; }, 600);
            }
        }, 120);
    }

    // --- LOGIN ---
    function kL(n) { state.logBuf += n; updL(); }
    function clearL() { state.logBuf = ""; updL(); }
    function updL() {
        const d = document.getElementById('log-disp');
        const m = document.getElementById('log-msg');
        if(state.logStep === 1) { d.innerText = state.logBuf || "ID?"; m.innerText = "ZADEJTE OSOBNÍ ID"; }
        else { d.innerText = "*".repeat(state.logBuf.length) || "PIN?"; m.innerText = "ZADEJTE BEZPEČNOSTNÍ PIN"; }
    }
    function submitL() {
        if(state.logStep === 1) {
            if(DB.users.find(u => u.id === state.logBuf)) { state.logStep = 2; state.logBuf = ""; updL(); }
            else { alert("Neznámé ID!"); clearL(); }
        } else {
            const user = DB.users.find(u => u.pin === state.logBuf);
            if(user) {
                document.getElementById('layer-login').style.display = 'none';
                document.getElementById('layer-app').style.display = 'flex';
                state.booted = true; initApp();
            } else { alert("Chybné PIN!"); clearL(); }
        }
    }

    // --- MENU & EDITOR ---
    function openMenu() {
        document.getElementById('layer-menu').style.display = 'flex';
        renderEditor();
    }
    function closeMenu() { document.getElementById('layer-menu').style.display = 'none'; }
    function setMT(t) {
        state.mTarget = t;
        document.querySelectorAll('.config-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`m-${t}`).classList.add('active');
    }
    function kM(n) {
        let el = document.getElementById(`val-m-${state.mTarget}`);
        el.innerText = (el.innerText === "0" || el.innerText === "790968") ? n : el.innerText + n;
    }
    function clearM() { document.getElementById(`val-m-${state.mTarget}`).innerText = "0"; }

    function renderEditor() {
        const box = document.getElementById('custom-stop-list');
        box.innerHTML = "";
        state.stops.forEach((s, i) => {
            box.innerHTML += `
                <div class="editor-row">
                    <input type="text" class="editor-input" value="${s.n}" onchange="updateStop(${i}, 'n', this.value)">
                    <input type="text" class="editor-input" value="${s.t}" onchange="updateStop(${i}, 't', this.value)">
                    <button onclick="removeStop(${i})" style="background:var(--syn-red); border:none; color:#fff">X</button>
                </div>
            `;
        });
    }
    function addCustomStop() { state.stops.push({n: "Nová zastávka", t: "00:00"}); renderEditor(); }
    function updateStop(i, key, val) { state.stops[i][key] = val; }
    function removeStop(i) { state.stops.splice(i, 1); renderEditor(); }

    function saveMenu() {
        state.line = document.getElementById('val-m-line').innerText;
        state.spoj = document.getElementById('val-m-spoj').innerText;
        
        checkSpecialModes();
        renderItinerary();
        closeMenu();
    }

    // --- SPECIÁLNÍ REŽIMY ---
    function checkSpecialModes() {
        const overlay = document.getElementById('special-overlay');
        const main = document.getElementById('app-main-area');
        const tickets = document.getElementById('app-ticket-bar');
        const stMode = document.getElementById('st-mode');
        const stIds = document.getElementById('st-ids');
        
        stIds.innerText = `${state.line} / ${state.spoj}`;
        overlay.style.display = "none";
        main.style.visibility = "visible";
        tickets.style.visibility = "visible";
        stMode.innerText = "TRASA";

        if(state.line === "10836102") {
            overlay.style.display = "flex";
            overlay.className = "pause-bg";
            document.getElementById('special-text').innerText = "PAUZA";
            document.getElementById('special-sub').style.display = "block";
            main.style.visibility = "hidden";
            tickets.style.visibility = "hidden";
            stMode.innerText = "ODPOČINEK";
        } else if(state.line === "6252") {
            overlay.style.display = "flex";
            overlay.className = "service-bg";
            document.getElementById('special-text').innerText = "SLUŽEBNÍ JÍZDA";
            document.getElementById('special-sub').style.display = "none";
            main.style.visibility = "hidden";
            tickets.style.visibility = "hidden";
            stMode.innerText = "SLUŽEBNÍ";
        }
    }

    // --- APP LOGIC ---
    function initApp() {
        renderItinerary();
        setInterval(() => {
            document.getElementById('st-clock').innerText = new Date().toLocaleTimeString('cs-CZ');
        }, 1000);
    }

    function renderItinerary() {
        const box = document.getElementById('stop-itinerary');
        box.innerHTML = "";
        state.stops.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = `stop-row ${i === state.idx ? 'active' : ''} ${i < state.idx ? 'passed' : ''}`;
            row.innerHTML = `<div>${s.t}</div><div>25|</div><div>${s.n}</div>`;
            box.appendChild(row);
        });
        const active = box.querySelector('.active');
        if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function nextStop() {
        if(state.idx < state.stops.length - 1) {
            state.idx++; renderItinerary();
            const g = document.getElementById('snd-gong'); g.currentTime = 0; g.play().catch(()=>{});
        }
    }

    function pickT(btn, p) {
        document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); state.price = p;
        document.getElementById('price-val').innerText = p.toFixed(2).replace('.', ',') + " Kč";
    }

    function doSale() { alert("JÍZDENKA VYTIŠTĚNA\nLinka: " + state.line + "\nCena: " + state.price + " Kč"); }

</script>
</body>
</html>
