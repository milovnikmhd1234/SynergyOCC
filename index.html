<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Synergy OCC - Autentický Simulátor</title>
    <style>
        :root {
            --synergy-blue: #0055a5;
            --screen-bg: #e0e0e0;
            --header-dark: #222;
            --btn-blue: #00aaff;
            --btn-yellow: #ffcc00;
            --btn-orange: #ff6600;
            --delay-red: #cc0000;
        }

        body {
            background: #1a1a1a;
            color: #333;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Modrý rám podle obrázku */
        #tablet-frame {
            width: 950px;
            height: 550px;
            background: var(--synergy-blue);
            border-radius: 15px;
            padding: 15px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 5px solid #003366;
            display: flex;
            flex-direction: column;
        }

        /* Displej */
        #display {
            width: 100%;
            height: 100%;
            background: var(--screen-bg);
            border: 3px solid #000;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Power Overlay */
        #power-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #444; font-family: monospace;
        }

        /* Horní lišta */
        .top-bar {
            background: var(--header-dark);
            color: white;
            height: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 14px;
        }

        .delay-box {
            background: var(--delay-red);
            padding: 2px 10px;
            font-weight: bold;
            border-radius: 3px;
        }

        /* Hlavní plocha (Zastávky + Numerika) */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 280px;
            flex: 1;
            overflow: hidden;
        }

        /* Levá část: Seznam zastávek */
        .stops-area {
            background: white;
            border-right: 2px solid #999;
            display: flex;
            flex-direction: column;
        }

        .stop-item {
            display: flex;
            padding: 6px 10px;
            border-bottom: 1px solid #ccc;
            font-size: 15px;
            align-items: center;
        }

        .stop-item.next { background: var(--btn-orange); color: white; font-weight: bold; }
        .stop-item .time { width: 60px; font-weight: bold; }
        .stop-item .zone { width: 40px; color: #666; font-size: 12px; }

        /* Pravá část: Numerika */
        .keypad-area {
            background: #ccc;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 5px;
        }

        .key {
            background: var(--synergy-blue);
            color: white;
            border: 1px solid #003366;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            height: 50px;
        }

        .key.action { background: #0088cc; font-size: 13px; }
        .key.green { background: #22aa22; }
        .key.orange { background: var(--btn-orange); }

        /* Spodní tlačítka jízdenek */
        .ticket-area {
            height: 100px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
            background: #999;
            padding: 2px;
        }

        .t-btn {
            background: #0088cc;
            color: white;
            border: none;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .t-btn.yellow { background: var(--btn-yellow); color: black; }

        /* Konfigurační obrazovka */
        .setup-screen {
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            background: white;
            height: 100%;
            overflow-y: auto;
        }

        input, textarea {
            padding: 8px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
        }

        /* Zapínací tlačítko */
        #power-btn {
            position: absolute;
            bottom: -5px;
            left: 20px;
            width: 45px;
            height: 45px;
            background: #222;
            border-radius: 50%;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            border: 3px solid #444;
        }
    </style>
</head>
<body>

<div id="tablet-frame">
    <div id="power-btn" onclick="togglePower()">🍄</div>

    <div id="display">
        <div id="power-overlay">
            <div id="boot-text" style="display:none">SYNERGY OCC INITIALIZING...</div>
        </div>

        <div class="top-bar">
            <span id="ui-mode">Jízda</span>
            <span id="ui-date">07.05.2026</span>
            <span class="delay-box" id="ui-delay">-0 m</span>
            <span id="ui-clock">18:48:00</span>
        </div>

        <div id="scr-setup" class="setup-screen" style="display: flex;">
            <h3>NASTAVENÍ TRASY</h3>
            <input type="text" id="set-line" placeholder="Číslo linky (např. 125)">
            <input type="text" id="set-course" placeholder="Kurz (např. 02)">
            <textarea id="set-stops" rows="5" placeholder="Zastávky (jedna na řádek)"></textarea>
            <p style="font-size: 11px; color: #666;">Poznámka: První zastávka je výchozí.</p>
            <button onclick="startDrive()" style="padding:15px; background:var(--synergy-blue); color:white; border:none;">AKTIVOVAT</button>
        </div>

        <div id="scr-drive" class="screen" style="display: none; height: 100%; flex-direction: column;">
            <div class="main-grid">
                <div class="stops-area" id="stop-list">
                    </div>
                <div class="keypad-area">
                    <div class="key action">Přestup</div><div class="key">7</div><div class="key">8</div><div class="key">9</div>
                    <div class="key action">Multi.</div><div class="key">4</div><div class="key">5</div><div class="key">6</div>
                    <div class="key action">Karta</div><div class="key">1</div><div class="key">2</div><div class="key">3</div>
                    <div class="key action">Storno</div><div class="key">.</div><div class="key">0</div><div class="key">±</div>
                    <div class="key orange" onclick="nextStop()">DALŠÍ</div>
                    <div class="key green" onclick="playGong()">GONG</div>
                </div>
            </div>

            <div class="ticket-area">
                <button class="t-btn yellow">Základní</button>
                <button class="t-btn">Dítě</button>
                <button class="t-btn">Student</button>
                <button class="t-btn">Osoba 65</button>
                <button class="t-btn">ZTP</button>
                <button class="t-btn">Pes</button>
                <button class="t-btn">Dítě do</button>
                <button class="t-btn">NavUstav</button>
                <button class="t-btn">Inv3st.</button>
                <button class="t-btn" onclick="showScreen('scr-setup')">ZPĚT</button>
            </div>
        </div>
    </div>
</div>

<audio id="audio-gong" src="gong.mp3"></audio>

<script>
    let isPowered = false;
    let stops = [];
    let currentIdx = 0;

    // Hodiny
    setInterval(() => {
        document.getElementById('ui-clock').innerText = new Date().toLocaleTimeString('cs-CZ');
    }, 1000);

    function togglePower() {
        const overlay = document.getElementById('power-overlay');
        const boot = document.getElementById('boot-text');
        if (!isPowered) {
            boot.style.display = "block";
            setTimeout(() => {
                overlay.style.display = "none";
                isPowered = true;
            }, 1500);
        } else {
            location.reload();
        }
    }

    function showScreen(id) {
        document.getElementById('scr-setup').style.display = "none";
        document.getElementById('scr-drive').style.display = "none";
        document.getElementById(id).style.display = "flex";
    }

    function startDrive() {
        const rawStops = document.getElementById('set-stops').value.split('\n');
        stops = rawStops.filter(s => s.trim() !== "");
        
        if (stops.length === 0) { alert("Zadej aspoň jednu zastávku!"); return; }
        
        currentIdx = 0;
        renderStops();
        showScreen('scr-drive');
        document.getElementById('ui-mode').innerText = "Jízda " + document.getElementById('set-line').value;
    }

    function renderStops() {
        const list = document.getElementById('stop-list');
        list.innerHTML = "";
        
        stops.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = `stop-item ${i === currentIdx ? 'next' : ''}`;
            const time = new Date();
            time.setMinutes(time.getMinutes() + (i * 3));
            
            div.innerHTML = `
                <span class="time">${time.getHours()}:${String(time.getMinutes()).padStart(2, '0')}</span>
                <span class="zone">25 |</span>
                <span class="name">${s}</span>
            `;
            list.appendChild(div);
        });
    }

    function nextStop() {
        if (currentIdx < stops.length - 1) {
            currentIdx++;
            playGong();
            renderStops();
            // Náhodná simulace zpoždění
            document.getElementById('ui-delay').innerText = `-${Math.floor(Math.random() * 5)} m`;
        } else {
            alert("Konečná zastávka!");
        }
    }

    function playGong() {
        const audio = document.getElementById('audio-gong');
        audio.play().catch(e => console.log("Gong soubor nenalezen, ale funkce volána."));
    }
</script>

</body>
</html>
