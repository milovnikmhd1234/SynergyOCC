<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synergy OCC Professional - Mobile Edition v8.0</title>
    <style>
        /* SYNERGY OCC - KOMPLETNÍ CSS STYLING
           Optimalizováno pro mobilní zobrazení a maximální přehlednost.
        */
        :root {
            --syn-blue: #004b93;
            --syn-dark: #001a33;
            --syn-orange: #f39200;
            --syn-yellow: #ffcc00;
            --syn-green: #4db748;
            --syn-red: #cc0000;
            --syn-light-blue: #00a4e4;
            --white: #ffffff;
            --grey-light: #f4f4f4;
            --grey-dark: #333333;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* HLAVNÍ ŠASI */
        #device-container {
            width: 100%;
            height: 100%;
            background: var(--syn-blue);
            display: flex;
            flex-direction: column;
            border: 4px solid var(--syn-dark);
            position: relative;
        }

        /* DISPLEJ */
        #lcd-screen {
            flex: 1;
            background: #000;
            margin: 4px;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- 1. BOOT SEQUENCE --- */
        #boot-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 10000;
            padding: 15px;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.4;
            overflow-y: auto;
            display: none;
        }

        /* --- 2. LOGIN SCREEN --- */
        #login-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            z-index: 9000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 90%;
            max-width: 300px;
            text-align: center;
        }

        .login-input-area {
            background: #000;
            color: var(--syn-yellow);
            font-size: 36px;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #444;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 5px;
        }

        /* --- 3. MENU / NASTAVENÍ LINKY --- */
        #menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--syn-dark);
            z-index: 8500;
            display: none;
            flex-direction: column;
            padding: 10px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .menu-field {
            background: #000;
            border: 1px solid var(--syn-light-blue);
            padding: 15px;
            text-align: center;
        }

        .menu-field.active {
            border: 2px solid var(--syn-yellow);
            background: #111;
        }

        /* --- 4. HLAVNÍ APLIKACE --- */
        #main-app {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .top-status {
            height: 35px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 13px;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }

        .delay-box {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 15px;
        }
        .delay-red { background: var(--syn-red); }
        .delay-gray { background: #444; }

        .middle-section {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 220px; /* Větší prostor pro zastávky */
            background: #444;
            gap: 1px;
            overflow: hidden;
        }

        /* SEZNAM ZASTÁVEK */
        .stop-list {
            background: var(--white);
            color: #000;
            overflow-y: auto;
            position: relative;
        }

        .stop-entry {
            display: grid;
            grid-template-columns: 55px 30px 1fr;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            align-items: center;
        }

        .stop-entry.active {
            background: var(--syn-orange);
            color: #fff;
            font-weight: bold;
        }

        .stop-entry.passed {
            opacity: 0.5;
        }

        /* NUMERIKA */
        .side-keypad {
            background: #999;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            padding: 1px;
        }

        .btn {
            background: var(--syn-blue);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            border: none;
            height: 52px;
        }

        .btn:active { background: var(--syn-light-blue); }
        .btn.f-keys { background: #555; font-size: 11px; }
        .btn.orange { background: var(--syn-orange); }
        .btn.green { background: var(--syn-green); }

        /* JÍZDENKY - SPODNÍ ČÁST */
        .bottom-tickets {
            height: 90px;
            background: #111;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 1px;
            padding: 2px;
        }

        .ticket-item {
            background: var(--syn-light-blue);
            color: #fff;
            border: none;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .ticket-item.selected {
            background: var(--syn-yellow);
            color: #000;
        }

        .ticket-item.menu-trigger {
            background: #444;
            color: var(--syn-yellow);
        }

        .price-display {
            position: absolute;
            bottom: 100px;
            right: 235px;
            font-size: 32px;
            font-weight: 900;
            color: var(--syn-red);
            text-shadow: 1px 1px 0 #fff;
            pointer-events: none;
        }

        /* 🍄 POWER BUTTON */
        #pwr-sensor {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 50px;
            height: 50px;
            background: #222;
            border: 2px solid #555;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            z-index: 11000;
            box-shadow: 0 0 15px #000;
        }

        /* POMOCNÉ TŘÍDY */
        .hidden { display: none !important; }
        .flex { display: flex !important; }

    </style>
</head>
<body>

<div id="device-container">
    <div id="pwr-sensor" onclick="initBoot()">🍄</div>

    <div id="lcd-screen">
        <div id="boot-overlay"></div>

        <div id="login-overlay">
            <div class="login-card">
                <div id="login-label" style="margin-bottom: 10px; font-size: 14px;">ZADEJTE ČÍSLO ŘIDIČE</div>
                <div class="login-input-area" id="login-val">ID?</div>
                <div class="side-keypad" style="grid-template-columns: repeat(3, 1fr); background:transparent">
                    <button class="btn" onclick="typeLogin(1)">1</button>
                    <button class="btn" onclick="typeLogin(2)">2</button>
                    <button class="btn" onclick="typeLogin(3)">3</button>
                    <button class="btn" onclick="typeLogin(4)">4</button>
                    <button class="btn" onclick="typeLogin(5)">5</button>
                    <button class="btn" onclick="typeLogin(6)">6</button>
                    <button class="btn" onclick="typeLogin(7)">7</button>
                    <button class="btn" onclick="typeLogin(8)">8</button>
                    <button class="btn" onclick="typeLogin(9)">9</button>
                    <button class="btn f-keys" onclick="clearLogin()">C</button>
                    <button class="btn" onclick="typeLogin(0)">0</button>
                    <button class="btn green" onclick="submitLogin()">OK</button>
                </div>
            </div>
        </div>

        <div id="menu-overlay">
            <h2 style="text-align:center; margin-bottom:15px; color:var(--syn-yellow)">NASTAVENÍ SLUŽBY</h2>
            <div class="menu-grid">
                <div class="menu-field" id="m-line" onclick="setMenuTarget('line')">
                    <small>LINKA</small><br><b id="m-val-line">790968</b>
                </div>
                <div class="menu-field" id="m-spoj" onclick="setMenuTarget('spoj')">
                    <small>SPOJ</small><br><b id="m-val-spoj">2</b>
                </div>
                <div class="menu-field" id="m-kurz" onclick="setMenuTarget('kurz')">
                    <small>KURZ</small><br><b id="m-val-kurz">1</b>
                </div>
                <div class="menu-field" style="background:var(--syn-red)" onclick="closeMenu()">
                    <small>ZPĚT</small><br><b>X</b>
                </div>
            </div>
            <div style="flex:1"></div>
            <div class="side-keypad" style="grid-template-columns: repeat(4, 1fr);">
                <button class="btn" onclick="typeMenu(7)">7</button>
                <button class="btn" onclick="typeMenu(8)">8</button>
                <button class="btn" onclick="typeMenu(9)">9</button>
                <button class="btn f-keys" onclick="clearMenu()">C</button>
                <button class="btn" onclick="typeMenu(4)">4</button>
                <button class="btn" onclick="typeMenu(5)">5</button>
                <button class="btn" onclick="typeMenu(6)">6</button>
                <button class="btn green" style="grid-row: span 2" onclick="closeMenu()">OK</button>
                <button class="btn" onclick="typeMenu(1)">1</button>
                <button class="btn" onclick="typeMenu(2)">2</button>
                <button class="btn" onclick="typeMenu(3)">3</button>
                <button class="btn" style="grid-column: span 2" onclick="typeMenu(0)">0</button>
                <button class="btn f-keys">.</button>
            </div>
        </div>

        <div id="main-app">
            <div class="top-status">
                <span id="st-run">790968 / 2 / 1</span>
                <span id="st-date">07.05.2026</span>
                <div id="st-delay" class="delay-box delay-gray">+0 m</div>
                <span id="st-clock">00:00:00</span>
            </div>

            <div class="middle-section">
                <div class="stop-list" id="stop-container">
                    </div>

                <div class="side-keypad">
                    <button class="btn f-keys">PŘEST</button>
                    <button class="btn" onclick="typeMain(7)">7</button>
                    <button class="btn" onclick="typeMain(8)">8</button>
                    <button class="btn" onclick="typeMain(9)">9</button>
                    <button class="btn f-keys">MULT</button>
                    <button class="btn" onclick="typeMain(4)">4</button>
                    <button class="btn" onclick="typeMain(5)">5</button>
                    <button class="btn" onclick="typeMain(6)">6</button>
                    <button class="btn f-keys">KART</button>
                    <button class="btn" onclick="typeMain(1)">1</button>
                    <button class="btn" onclick="typeMain(2)">2</button>
                    <button class="btn" onclick="typeMain(3)">3</button>
                    <button class="btn f-keys" onclick="mainClear()">STOR</button>
                    <button class="btn" onclick="typeMain('.')">.</button>
                    <button class="btn" onclick="typeMain(0)">0</button>
                    <button class="btn f-keys">±</button>
                    <button class="btn orange" style="grid-column: span 2" onclick="doNext()">DALŠÍ</button>
                    <button class="btn green" style="grid-column: span 2" onclick="doSell()">OK</button>
                </div>
                
                <div class="price-display" id="pr-val">11,00 Kč</div>
            </div>

            <div class="bottom-tickets">
                <button class="ticket-item menu-trigger" onclick="openMenu()">MENU</button>
                <button class="ticket-item selected" onclick="setCat(this, 11)">Základní</button>
                <button class="ticket-item" onclick="setCat(this, 5)">Dítě</button>
                <button class="ticket-item" onclick="setCat(this, 8)">Student</button>
                <button class="ticket-item" onclick="setCat(this, 8)">Osoba 65</button>
                <button class="ticket-item" onclick="setCat(this, 0)">ZTP</button>
                <button class="ticket-item" onclick="setCat(this, 7)">Pes</button>
                <button class="ticket-item" onclick="setCat(this, 0)">Dítě do</button>
                <button class="ticket-item" onclick="setCat(this, 0)">NavUstav</button>
                <button class="ticket-item red" onclick="location.reload()">KONEC</button>
            </div>
        </div>
    </div>
</div>

<audio id="snd-gong" src="gong.mp3" preload="auto"></audio>

<script>
    /* --- SYNERGY OCC CORE LOGIC --- */

    const DATA = {
        driver: "10342",
        pin: "3508",
        stops: [
            {n: "Studená,,ul.1.máje a", t: "19:35"},
            {n: "Studená,,H.Bolíko,roz", t: "19:38"},
            {n: "Mrákotín", t: "19:45"},
            {n: "Krahulčí", t: "19:49"},
            {n: "Telč,,aut.nádr.", t: "19:59"},
            {n: "Telč,,Interiér", t: "20:01"},
            {n: "Dyjice,Dolní Dvorce", t: "20:03"},
            {n: "Radkov", t: "20:08"},
            {n: "Slaviboř", t: "20:12"},
            {n: "Černíč", t: "20:15"},
            {n: "Třešť", t: "20:30"},
            {n: "Jihlava,,aut.nádr.", t: "20:55"}
        ]
    };

    let state = {
        power: false,
        loginStep: 1, // 1: ID, 2: PIN
        loginBuf: "",
        menuTarget: 'line',
        line: "790968",
        spoj: "2",
        kurz: "1",
        idx: 0,
        price: 11,
        mainBuf: ""
    };

    // 1. BOOTOVÁNÍ (16 AKCÍ)
    function initBoot() {
        if(state.power) return;
        const b = document.getElementById('boot-overlay');
        b.style.display = 'block';

        // Povolení audia
        const g = document.getElementById('snd-gong');
        g.play().then(() => g.pause()).catch(() => {});

        const logs = [
            "Synergy Hardware Abstraction Layer v8.0.4",
            "CPU: ARM Cortex-A53 rev 4 (v8l) - 4 Cores",
            "RAM: 2048MB testing... OK",
            "STORAGE: eMMC 16GB mount /system ... OK",
            "MODEM: Qualcomm Snapdragon X5 LTE searching...",
            "MODEM: Connected to O2 CZ (RSRQ: -11dB)",
            "GPS: Time sync via GNSS... Locked.",
            "OS: Synergy Linux Kernel 5.15.0-occ boot",
            "OS: Initializing VDV-KA secure element...",
            "OS: Loading graphic drivers (Mali-T720)...",
            "SERVICE: StopDatabase sync (14.288 records)",
            "SERVICE: TicketPrinter check... READY",
            "SERVICE: CardReader (NFC) check... READY",
            "GUI: Loading Synergy OCC Application Shell...",
            "GUI: Touchscreen calibration... DONE",
            "SYSTEM: READY. WAITING FOR OPERATOR."
        ];

        let i = 0;
        const timer = setInterval(() => {
            b.innerHTML += `<div><span style="color:#666">[${new Date().toLocaleTimeString()}]</span> ${logs[i]}</div>`;
            b.scrollTop = b.scrollHeight;
            i++;
            if(i >= logs.length) {
                clearInterval(timer);
                setTimeout(() => {
                    b.style.display = 'none';
                    document.getElementById('login-overlay').style.display = 'flex';
                }, 800);
            }
        }, 130);
    }

    // 2. LOGIN LOGIKA
    function typeLogin(n) {
        state.loginBuf += n;
        renderLogin();
    }
    function clearLogin() {
        state.loginBuf = "";
        renderLogin();
    }
    function renderLogin() {
        const d = document.getElementById('login-val');
        if(state.loginStep === 1) d.innerText = state.loginBuf || "ID?";
        else d.innerText = "*".repeat(state.loginBuf.length) || "PIN?";
    }
    function submitLogin() {
        if(state.loginStep === 1) {
            if(state.loginBuf === DATA.driver) {
                state.loginStep = 2;
                state.loginBuf = "";
                document.getElementById('login-label').innerText = "ZADEJTE PIN";
                renderLogin();
            } else {
                alert("Neznámé ID!"); clearLogin();
            }
        } else {
            if(state.loginBuf === DATA.pin) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                state.power = true;
                runApp();
            } else {
                alert("Špatný PIN!"); clearLogin();
            }
        }
    }

    // 3. MENU LOGIKA
    function openMenu() {
        document.getElementById('menu-overlay').style.display = 'flex';
        setMenuTarget('line');
    }
    function closeMenu() {
        document.getElementById('menu-overlay').style.display = 'none';
        state.line = document.getElementById('m-val-line').innerText;
        state.spoj = document.getElementById('m-val-spoj').innerText;
        state.kurz = document.getElementById('m-val-kurz').innerText;
        document.getElementById('st-run').innerText = `${state.line} / ${state.spoj} / ${state.kurz}`;
    }
    function setMenuTarget(t) {
        state.menuTarget = t;
        document.querySelectorAll('.menu-field').forEach(f => f.classList.remove('active'));
        document.getElementById(`m-${t}`).classList.add('active');
    }
    function typeMenu(n) {
        let el = document.getElementById(`m-val-${state.menuTarget}`);
        if(el.innerText === "0") el.innerText = n;
        else el.innerText += n;
    }
    function clearMenu() {
        document.getElementById(`m-val-${state.menuTarget}`).innerText = "";
    }

    // 4. HLAVNÍ APLIKACE
    function runApp() {
        buildStops();
        setInterval(tick, 1000);
    }

    function tick() {
        const now = new Date();
        document.getElementById('st-clock').innerText = now.toLocaleTimeString('cs-CZ');
        
        // Výpočet zpoždění
        const stopTime = DATA.stops[state.idx].t.split(':');
        const plan = new Date();
        plan.setHours(stopTime[0], stopTime[1], 0);
        
        const diff = Math.floor((now - plan) / 60000);
        const del = document.getElementById('st-delay');
        del.innerText = (diff >= 0 ? "+" : "") + diff + " m";
        del.className = `delay-box ${diff > 0 ? 'delay-red' : 'delay-gray'}`;
    }

    function buildStops() {
        const container = document.getElementById('stop-container');
        container.innerHTML = '';
        DATA.stops.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = `stop-entry ${i === state.idx ? 'active' : ''} ${i < state.idx ? 'passed' : ''}`;
            row.innerHTML = `<div>${s.t}</div><div style="color:#999; font-size:10px">25 |</div><div>${s.n}</div>`;
            container.appendChild(row);
        });
        const active = container.querySelector('.active');
        if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function typeMain(n) {
        state.mainBuf += n;
        console.log("Buffer:", state.mainBuf);
    }
    function mainClear() {
        state.mainBuf = "";
    }

    function doNext() {
        if(state.idx < DATA.stops.length - 1) {
            state.idx++;
            buildStops();
            const g = document.getElementById('snd-gong');
            g.currentTime = 0;
            g.play().catch(() => {});
        }
    }

    function setCat(btn, p) {
        document.querySelectorAll('.ticket-item').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.price = p;
        document.getElementById('pr-val').innerText = p.toFixed(2).replace('.', ',') + " Kč";
    }

    function doSell() {
        alert("Lístek vytisknut. Cena: " + state.price + " Kč");
    }

</script>
</body>
</html>
