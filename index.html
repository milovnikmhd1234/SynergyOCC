<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synergy OCC - Ultimate Mobile v7.0</title>
    <style>
        /* KOMPLETNÍ CSS STYLING 
           Optimalizováno pro mobilní zařízení, těsná tlačítka 
        */
        :root {
            --syn-blue: #004b93;
            --syn-dark: #00264d;
            --syn-orange: #f39200;
            --syn-yellow: #ffcc00;
            --syn-green: #4db748;
            --syn-red: #cc0000;
            --syn-light-blue: #00a4e4;
            --bg-black: #000000;
            --text-grey: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* HLAVNÍ KONTEJNER */
        #occ-frame {
            width: 100vw;
            height: 100vh;
            background: var(--syn-blue);
            display: flex;
            flex-direction: column;
            border: 5px solid var(--syn-dark);
            position: relative;
        }

        #display-wrapper {
            flex: 1;
            background: #000;
            margin: 5px;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- BOOT SCREEN --- */
        #boot-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            padding: 20px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-y: auto;
            display: none;
        }

        /* --- LOGIN SCREEN --- */
        #login-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            z-index: 8000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 280px;
            text-align: center;
        }

        .display-num {
            background: #000;
            color: var(--syn-yellow);
            font-size: 32px;
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid #333;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 4px;
        }

        /* --- MAIN UI --- */
        #main-ui {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .status-bar {
            height: 40px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border-bottom: 2px solid #222;
            font-weight: bold;
            font-size: 14px;
        }

        .delay-indicator {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 16px;
        }
        .late { background: var(--syn-red); }
        .on-time { background: #333; }

        /* PRACOVNÍ PLOCHA */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 80px 1fr 240px; /* Užší klávesnice pro mobil */
            background: #444;
            gap: 1px;
        }

        /* LEVÝ PANEL (LINKA / SPOJ) */
        .sidebar-left {
            background: #111;
            display: flex;
            flex-direction: column;
            padding: 10px 4px;
            gap: 10px;
        }

        .input-block {
            text-align: center;
        }

        .label-mini { font-size: 9px; color: #777; margin-bottom: 2px; }
        .value-box {
            background: #222;
            border: 1px solid var(--syn-light-blue);
            color: var(--syn-yellow);
            padding: 8px 0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .value-box.active-edit {
            border-color: var(--syn-yellow);
            background: #333;
        }

        /* STŘEDNÍ PANEL (ZASTÁVKY) */
        .itinerary {
            background: #fff;
            color: #000;
            overflow-y: auto;
        }

        .stop-row {
            display: grid;
            grid-template-columns: 60px 30px 1fr;
            padding: 10px 8px;
            border-bottom: 1px solid #ddd;
            font-size: 15px;
            align-items: center;
        }

        .stop-row.active {
            background: var(--syn-orange);
            color: #fff;
            font-weight: bold;
        }

        /* NUMERICKÁ KLÁVESNICE - TĚSNÁ */
        .numpad {
            background: #888;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            padding: 1px;
        }

        .k-btn {
            background: var(--syn-blue);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            height: 60px;
            cursor: pointer;
            border: none;
        }

        .k-btn:active { background: var(--syn-light-blue); }
        .k-btn.grey { background: #444; font-size: 12px; }
        .k-btn.orange { background: var(--syn-orange); }
        .k-btn.green { background: var(--syn-green); }

        /* JÍZDENKY - SPODNÍ LIŠTA */
        .ticket-bar {
            height: 100px;
            background: #1a1a1a;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 1px;
            padding: 1px;
        }

        .t-btn {
            background: var(--syn-light-blue);
            color: #fff;
            border: none;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .t-btn.selected {
            background: var(--syn-yellow);
            color: #000;
        }

        .t-btn.red { background: var(--syn-red); }

        .price-overlay {
            position: absolute;
            bottom: 110px;
            right: 250px;
            font-size: 36px;
            font-weight: 900;
            color: var(--syn-red);
            text-shadow: 2px 2px 0 #fff;
            pointer-events: none;
        }

        /* 🍄 POWER BUTTON */
        #power-switch {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 55px;
            height: 55px;
            background: #222;
            border: 3px solid #444;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            z-index: 10000;
            box-shadow: 0 4px 15px #000;
        }

        /* ÚPRAVA PRO VELMI MALÉ DISPLEJE */
        @media (max-height: 500px) {
            .k-btn { height: 45px; font-size: 18px; }
            .status-bar { height: 30px; }
            .ticket-bar { height: 80px; }
        }
    </style>
</head>
<body>

<div id="occ-frame">
    <div id="power-switch" onclick="sysBoot()">🍄</div>

    <div id="display-wrapper">
        <div id="boot-layer"></div>

        <div id="login-layer">
            <div class="login-box">
                <div id="login-title" style="margin-bottom: 10px; color:#aaa">ZADEJTE ID ŘIDIČE</div>
                <div class="display-num" id="login-disp">_</div>
                <div class="numpad" style="grid-template-columns: repeat(3, 1fr); background:transparent">
                    <button class="k-btn" onclick="tapLogin(1)">1</button>
                    <button class="k-btn" onclick="tapLogin(2)">2</button>
                    <button class="k-btn" onclick="tapLogin(3)">3</button>
                    <button class="k-btn" onclick="tapLogin(4)">4</button>
                    <button class="k-btn" onclick="tapLogin(5)">5</button>
                    <button class="k-btn" onclick="tapLogin(6)">6</button>
                    <button class="k-btn" onclick="tapLogin(7)">7</button>
                    <button class="k-btn" onclick="tapLogin(8)">8</button>
                    <button class="k-btn" onclick="tapLogin(9)">9</button>
                    <button class="k-btn grey" onclick="clearLogin()">C</button>
                    <button class="k-btn" onclick="tapLogin(0)">0</button>
                    <button class="k-btn green" onclick="submitLogin()">OK</button>
                </div>
            </div>
        </div>

        <div id="main-ui">
            <div class="status-bar">
                <span id="ui-run">790968 / 2</span>
                <span>07.05.2026</span>
                <div id="ui-delay" class="delay-indicator on-time">+0 m</div>
                <span id="ui-clock">00:00:00</span>
            </div>

            <div class="workspace">
                <div class="sidebar-left">
                    <div class="input-block">
                        <div class="label-mini">LINKA</div>
                        <div class="value-box" id="box-line" onclick="setActiveInput('line')">790968</div>
                    </div>
                    <div class="input-block">
                        <div class="label-mini">SPOJ</div>
                        <div class="value-box" id="box-spoj" onclick="setActiveInput('spoj')">2</div>
                    </div>
                    <div style="flex:1"></div>
                    <div class="value-box grey" style="color:#fff; font-size:10px" onclick="location.reload()">RESTART</div>
                </div>

                <div class="itinerary" id="stop-list">
                    </div>

                <div class="numpad">
                    <button class="k-btn grey">PŘES</button>
                    <button class="k-btn" onclick="tapNum(7)">7</button>
                    <button class="k-btn" onclick="tapNum(8)">8</button>
                    <button class="k-btn" onclick="tapNum(9)">9</button>
                    
                    <button class="k-btn grey">MULT</button>
                    <button class="k-btn" onclick="tapNum(4)">4</button>
                    <button class="k-btn" onclick="tapNum(5)">5</button>
                    <button class="k-btn" onclick="tapNum(6)">6</button>
                    
                    <button class="k-btn grey">KART</button>
                    <button class="k-btn" onclick="tapNum(1)">1</button>
                    <button class="k-btn" onclick="tapNum(2)">2</button>
                    <button class="k-btn" onclick="tapNum(3)">3</button>
                    
                    <button class="k-btn grey" onclick="clearBuffer()">STOR</button>
                    <button class="k-btn" onclick="tapNum('.')">.</button>
                    <button class="k-btn" onclick="tapNum(0)">0</button>
                    <button class="k-btn grey" onclick="tapNum('±')">±</button>
                    
                    <button class="k-btn orange" style="grid-column: span 2" onclick="nextStop()">DALŠÍ</button>
                    <button class="k-btn green" style="grid-column: span 2" onclick="confirmAction()">OK</button>
                </div>

                <div class="price-overlay" id="ui-price">11,00 Kč</div>
            </div>

            <div class="ticket-bar">
                <button class="t-btn selected" onclick="setCat(this, 11)">Základní</button>
                <button class="t-btn" onclick="setCat(this, 5)">Dítě</button>
                <button class="t-btn" onclick="setCat(this, 8)">Student</button>
                <button class="t-btn" onclick="setCat(this, 8)">Osoba 65</button>
                <button class="t-btn" onclick="setCat(this, 0)">ZTP</button>
                <button class="t-btn" onclick="setCat(this, 7)">Pes</button>
                <button class="t-btn" onclick="setCat(this, 0)">Dítě do</button>
                <button class="t-btn" onclick="setCat(this, 0)">NavUstav</button>
                <button class="t-btn" onclick="setCat(this, 0)">Inv3st.</button>
                <button class="t-btn red" onclick="location.reload()">KONEC</button>
            </div>
        </div>
    </div>
</div>

<audio id="snd-gong" src="gong.mp3" preload="auto"></audio>

<script>
    /* --- SYNERGY OCC LOGIC CORE --- */

    const DB = {
        driver: "10342",
        pin: "3508",
        stops: [
            {n: "Studená,,ul.1.máje a", t: "19:35"},
            {n: "Studená,,H.Bolíko,roz", t: "19:38"},
            {n: "Mrákotín", t: "19:45"},
            {n: "Krahulčí", t: "19:49"},
            {n: "Telč,,aut.nádr.", t: "19:59"},
            {n: "Telč,,Interiér", t: "20:01"},
            {n: "Dyjice,Dolní Dvorce", t: "20:03"},
            {n: "Radkov", t: "20:08"},
            {n: "Slaviboř", t: "20:12"},
            {n: "Černíč", t: "20:15"}
        ]
    };

    let state = {
        booted: false,
        loginStep: 1, // 1: ID, 2: PIN
        loginBuf: "",
        activeInput: null, // 'line' nebo 'spoj'
        line: "790968",
        spoj: "2",
        curIdx: 0,
        price: 11,
        numBuf: ""
    };

    // --- BOOTOVÁNÍ ---
    function sysBoot() {
        if(state.booted) return;
        const layer = document.getElementById('boot-layer');
        layer.style.display = 'block';

        // Povolit zvuk
        const gong = document.getElementById('snd-gong');
        gong.play().then(() => { gong.pause(); }).catch(()=>{});

        const logLines = [
            "SYNERGY BOOTLOADER v7.0.1 (build 2026-05-07)",
            "CPU: ARMv8 64-bit Core initialized.",
            "RAM: 2048MB DDR4 testing... OK",
            "DISK: Internal 16GB mount /root ... OK",
            "NET: LTE/GPRS modem search... Found (O2 CZ)",
            "NET: IP Address 10.42.18.99 assigned.",
            "KERN: Loading SynergyOS Kernel 5.10.0...",
            "KERN: Modules: [vdv-ka, thermal, touchscreen, printer] loaded.",
            "GPS: Searching for satellites... Locked (49.18N, 15.45E)",
            "VDV: Smartcard Reader initialized (slot 0).",
            "DB: Stop list database sync... 14.288 records.",
            "UI: Starting X-Server graphical engine...",
            "UI: Calibrating touch interface...",
            "AUTH: Waiting for driver identification...",
            "SYSTEM READY."
        ];

        let lineIdx = 0;
        const interval = setInterval(() => {
            layer.innerHTML += `<div><span style="color:#666">[${new Date().toLocaleTimeString()}]</span> ${logLines[lineIdx]}</div>`;
            layer.scrollTop = layer.scrollHeight;
            lineIdx++;
            if(lineIdx >= logLines.length) {
                clearInterval(interval);
                setTimeout(() => {
                    layer.style.display = 'none';
                    document.getElementById('login-layer').style.display = 'flex';
                }, 800);
            }
        }, 150);
    }

    // --- LOGIN LOGIKA ---
    function tapLogin(n) {
        state.loginBuf += n;
        renderLogin();
    }

    function clearLogin() {
        state.loginBuf = "";
        renderLogin();
    }

    function renderLogin() {
        const d = document.getElementById('login-disp');
        if(state.loginStep === 1) d.innerText = state.loginBuf || "ID?";
        else d.innerText = "*".repeat(state.loginBuf.length) || "PIN?";
    }

    function submitLogin() {
        if(state.loginStep === 1) {
            if(state.loginBuf === DB.driver) {
                state.loginStep = 2;
                state.loginBuf = "";
                document.getElementById('login-title').innerText = "ZADEJTE PIN";
                renderLogin();
            } else {
                alert("Chybné ID!");
                clearLogin();
            }
        } else {
            if(state.loginBuf === DB.pin) {
                document.getElementById('login-layer').style.display = 'none';
                document.getElementById('main-ui').style.display = 'flex';
                state.booted = true;
                initApp();
            } else {
                alert("Špatný PIN!");
                clearLogin();
            }
        }
    }

    // --- HLAVNÍ UI FUNKCE ---
    function initApp() {
        renderStops();
        setInterval(clockTick, 1000);
    }

    function clockTick() {
        const now = new Date();
        document.getElementById('ui-clock').innerText = now.toLocaleTimeString('cs-CZ');
        
        // Zpoždění
        const [ph, pm] = DB.stops[state.curIdx].t.split(':').map(Number);
        const plan = new Date();
        plan.setHours(ph, pm, 0);

        const diff = Math.floor((now - plan) / 60000);
        const delEl = document.getElementById('ui-delay');
        delEl.innerText = (diff >= 0 ? "+" : "") + diff + " m";
        delEl.className = `delay-indicator ${diff > 0 ? 'late' : 'on-time'}`;
    }

    function renderStops() {
        const cont = document.getElementById('stop-list');
        cont.innerHTML = '';
        DB.stops.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = `stop-row ${i === state.curIdx ? 'active' : ''}`;
            row.innerHTML = `<div>${s.t}</div><div style="font-size:10px; color:#888">25|</div><div>${s.n}</div>`;
            cont.appendChild(row);
        });
        const active = cont.querySelector('.active');
        if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // Změna linky/spoje
    function setActiveInput(target) {
        state.activeInput = target;
        state.numBuf = "";
        document.querySelectorAll('.value-box').forEach(b => b.classList.remove('active-edit'));
        document.getElementById(`box-${target}`).classList.add('active-edit');
    }

    function tapNum(n) {
        if(state.activeInput) {
            state.numBuf += n;
            document.getElementById(`box-${state.activeInput}`).innerText = state.numBuf;
        } else {
            // Logika pro zadávání ceny nebo pásma
            state.numBuf += n;
        }
    }

    function clearBuffer() {
        state.numBuf = "";
        if(state.activeInput) {
            document.getElementById(`box-${state.activeInput}`).innerText = "_";
        }
    }

    function confirmAction() {
        if(state.activeInput) {
            if(state.activeInput === 'line') state.line = state.numBuf;
            else state.spoj = state.numBuf;
            
            document.getElementById('ui-run').innerText = `${state.line} / ${state.spoj}`;
            state.activeInput = null;
            state.numBuf = "";
            document.querySelectorAll('.value-box').forEach(b => b.classList.remove('active-edit'));
        } else {
            alert("Akce potvrzena.");
        }
    }

    function nextStop() {
        if(state.curIdx < DB.stops.length - 1) {
            state.curIdx++;
            renderStops();
            const g = document.getElementById('snd-gong');
            g.currentTime = 0;
            g.play().catch(()=>{});
        }
    }

    function setCat(btn, p) {
        document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.price = p;
        document.getElementById('ui-price').innerText = p.toFixed(2).replace('.', ',') + " Kč";
    }

</script>
</body>
</html>
