<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synergy OCC Mobile Optimized</title>
    <style>
        /* --- KOMPLEXNÍ STYLOVÁNÍ --- */
        :root {
            --syn-blue: #004b93;
            --syn-dark: #011d3a;
            --syn-orange: #f39200;
            --syn-yellow: #ffcc00;
            --syn-green: #4db748;
            --syn-red: #cc0000;
            --syn-btn-blue: #00a4e4;
            --lcd-bg: #f0f0f0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Roboto', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* ŠASI - Optimalizace pro mobil (flexibilní šířka) */
        #occ-frame {
            width: 98vw;
            height: 96vh;
            max-width: 1024px;
            background: var(--syn-blue);
            border-radius: 15px;
            padding: 10px;
            position: relative;
            border: 4px solid #002d5a;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #screen {
            flex: 1;
            background: #000;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            border: 2px solid #111;
        }

        /* --- BOOT & LOGY --- */
        #boot-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 2000;
            padding: 15px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.3;
            overflow-y: auto;
            display: none;
        }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a;
            z-index: 1500;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .login-display {
            background: #000;
            color: var(--syn-yellow);
            width: 100%;
            max-width: 250px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
            border: 2px solid #444;
            font-family: monospace;
        }

        /* --- HLAVNÍ UI --- */
        .ui-main {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #000;
        }

        .header {
            height: 35px;
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }

        .delay-pill {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 14px;
        }
        .delay-late { background: var(--syn-red); }
        .delay-ok { background: #444; }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 55px 1fr 220px;
            gap: 1px;
            background: #444;
            overflow: hidden;
        }

        /* LEVÝ PANEL */
        .sidebar-left {
            background: #111;
            display: flex;
            flex-direction: column;
            padding: 5px 2px;
            gap: 8px;
        }
        .side-val {
            background: #222;
            border: 1px solid var(--syn-btn-blue);
            color: var(--syn-yellow);
            text-align: center;
            padding: 4px 0;
            font-size: 11px;
            font-weight: bold;
        }

        /* STŘED - ZASTÁVKY */
        .stop-area {
            background: #fff;
            color: #000;
            overflow-y: auto;
            position: relative;
        }
        .stop-row {
            display: grid;
            grid-template-columns: 50px 25px 1fr;
            padding: 8px 5px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            align-items: center;
        }
        .stop-row.active {
            background: var(--syn-orange);
            color: #fff;
            font-weight: bold;
        }

        /* CENA */
        .price-float {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 32px;
            font-weight: 900;
            color: var(--syn-red);
            text-shadow: 1px 1px 0 #fff;
            pointer-events: none;
        }

        /* KLÁVESNICE - MENŠÍ TLAČÍTKA */
        .numpad {
            background: #bbb;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            padding: 3px;
        }
        .btn {
            background: var(--syn-blue);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            height: 48px;
            border: 1px solid #002d5a;
        }
        .btn:active { background: var(--syn-btn-blue); }
        .btn.f { background: #555; font-size: 11px; }
        .btn.orange { background: var(--syn-orange); }
        .btn.green { background: var(--syn-green); }

        /* JÍZDENKY DOLE */
        .ticket-grid {
            height: 90px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            padding: 3px;
            background: #1a1a1a;
        }
        .t-btn {
            background: var(--syn-btn-blue);
            color: #fff;
            border: none;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .t-btn.selected { background: var(--syn-yellow); color: #000; }
        .t-btn.red { background: var(--syn-red); }

        /* 🍄 POWER */
        #pwr-trigger {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 45px;
            height: 45px;
            background: #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 3000;
            border: 3px solid #555;
            box-shadow: 0 4px 10px #000;
        }

        /* RESPONZIVNÍ ÚPRAVY PRO MALÉ MOBILY */
        @media (max-width: 600px) {
            .workspace { grid-template-columns: 45px 1fr 160px; }
            .btn { height: 40px; font-size: 16px; }
            .t-btn { font-size: 8px; }
            .price-float { font-size: 24px; }
        }
    </style>
</head>
<body>

<div id="occ-frame">
    <div id="pwr-trigger" onclick="handlePower()">🍄</div>

    <div id="screen">
        <div id="boot-overlay"></div>

        <div id="login-screen">
            <div style="color:#aaa; font-size:12px; margin-bottom:5px;" id="login-hint">Zadejte ID řidiče</div>
            <div class="login-display" id="login-val">ID?</div>
            <div class="numpad" style="grid-template-columns: repeat(3, 1fr); background:transparent; width: 100%; max-width: 250px;">
                <div class="btn" onclick="loginType(1)">1</div><div class="btn" onclick="loginType(2)">2</div><div class="btn" onclick="loginType(3)">3</div>
                <div class="btn" onclick="loginType(4)">4</div><div class="btn" onclick="loginType(5)">5</div><div class="btn" onclick="loginType(6)">6</div>
                <div class="btn" onclick="loginType(7)">7</div><div class="btn" onclick="loginType(8)">8</div><div class="btn" onclick="loginType(9)">9</div>
                <div class="btn f" onclick="loginClear()">C</div><div class="btn" onclick="loginType(0)">0</div><div class="btn green" onclick="loginSubmit()">OK</div>
            </div>
        </div>

        <div id="ui-app" class="ui-main">
            <div class="header">
                <span id="h-line">790968 / 2</span>
                <span id="h-date">07.05.2026</span>
                <div id="h-delay" class="delay-pill delay-ok">+0 m</div>
                <span id="h-clock">00:00:00</span>
            </div>

            <div class="workspace">
                <div class="sidebar-left">
                    <div style="font-size:8px; color:#555; text-align:center">LINKA</div>
                    <div class="side-val" id="s-line">790968</div>
                    <div style="font-size:8px; color:#555; text-align:center">SPOJ</div>
                    <div class="side-val" id="s-spoj">2</div>
                </div>

                <div class="stop-area" id="stop-cont">
                    </div>

                <div class="numpad">
                    <div class="btn f">PŘES</div><div class="btn">7</div><div class="btn">8</div><div class="btn">9</div>
                    <div class="btn f">MULT</div><div class="btn">4</div><div class="btn">5</div><div class="btn">6</div>
                    <div class="btn f">KART</div><div class="btn">1</div><div class="btn">2</div><div class="btn">3</div>
                    <div class="btn f" onclick="storno()">STOR</div><div class="btn">.</div><div class="btn">0</div><div class="btn">±</div>
                    <div class="btn orange" style="grid-column: span 2" onclick="driveNext()">DALŠÍ</div>
                    <div class="btn green" style="grid-column: span 2" onclick="sell()">OK</div>
                </div>

                <div class="price-float" id="v-price">11,00 Kč</div>
            </div>

            <div class="ticket-grid">
                <button class="t-btn selected" onclick="setTicket(this, 11)">Základní</button>
                <button class="t-btn" onclick="setTicket(this, 5)">Dítě</button>
                <button class="t-btn" onclick="setTicket(this, 8)">Student</button>
                <button class="t-btn" onclick="setTicket(this, 8)">Osoba 65</button>
                <button class="t-btn" onclick="setTicket(this, 0)">ZTP</button>
                <button class="t-btn" onclick="setTicket(this, 7)">Pes</button>
                <button class="t-btn" onclick="setTicket(this, 0)">Dítě do</button>
                <button class="t-btn" onclick="setTicket(this, 0)">NavUstav</button>
                <button class="t-btn" onclick="setTicket(this, 0)">Inv3st.</button>
                <button class="t-btn red" onclick="location.reload()">KONEC</button>
            </div>
        </div>
    </div>
</div>

<audio id="snd-gong" src="gong.mp3"></audio>

<script>
    /* --- LOGIKA A STAV --- */
    const CONFIG = {
        driverId: "10342",
        driverPin: "3508",
        stops: [
            {n: "Studená,,ul.1.máje a", t: "19:35"},
            {n: "Studená,,H.Bolíko,roz", t: "19:38"},
            {n: "Mrákotín", t: "19:45"},
            {n: "Krahulčí", t: "19:49"},
            {n: "Telč,,aut.nádr.", t: "19:59"},
            {n: "Telč,,Interiér", t: "20:01"},
            {n: "Dyjice,Dolní Dvorce", t: "20:03"}
        ]
    };

    let app = {
        power: false,
        booting: false,
        loggedIn: false,
        loginStep: 'id', // 'id' nebo 'pin'
        buffer: "",
        activeIdx: 0,
        price: 11
    };

    // 1. ZAPNUTÍ A LOGY
    function handlePower() {
        if(app.power || app.booting) return;
        app.booting = true;
        
        const overlay = document.getElementById('boot-overlay');
        overlay.style.display = 'block';

        // Aktivace audia
        document.getElementById('snd-gong').play().then(() => {
            document.getElementById('snd-gong').pause();
        }).catch(() => {});

        const logs = [
            "SYS: Synergy Kernel 5.4.12 booting...",
            "HW: CPU QuadCore ARM @ 1.2GHz ... OK",
            "HW: MemTest 1024MB ... OK",
            "HW: LTE Module ... Connected",
            "HW: GPS Receiver ... Signal Found",
            "OS: Mounting filesystems...",
            "OS: Loading VDV-KA libraries...",
            "OS: Starting Graphic Engine...",
            "APP: Database check ... 14,205 stops",
            "APP: Syncing RTC time...",
            "APP: Connecting to dispatcher...",
            "APP: Driver Auth Service started.",
            "BOOT COMPLETE. Redirecting to Login."
        ];

        let i = 0;
        const interval = setInterval(() => {
            overlay.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${logs[i]}</div>`;
            overlay.scrollTop = overlay.scrollHeight;
            i++;
            if(i >= logs.length) {
                clearInterval(interval);
                setTimeout(() => {
                    overlay.style.display = 'none';
                    document.getElementById('login-screen').style.display = 'flex';
                    app.booting = false;
                    app.power = true;
                }, 1000);
            }
        }, 180);
    }

    // 2. PŘIHLÁŠENÍ
    function loginType(n) {
        app.buffer += n;
        updateLoginDisplay();
    }

    function loginClear() {
        app.buffer = "";
        updateLoginDisplay();
    }

    function updateLoginDisplay() {
        const d = document.getElementById('login-val');
        if(app.loginStep === 'id') {
            d.innerText = app.buffer || "ID?";
        } else {
            d.innerText = "*".repeat(app.buffer.length) || "PIN?";
        }
    }

    function loginSubmit() {
        if(app.loginStep === 'id') {
            if(app.buffer === CONFIG.driverId) {
                app.loginStep = 'pin';
                app.buffer = "";
                document.getElementById('login-hint').innerText = "Zadejte PIN";
                updateLoginDisplay();
            } else {
                alert("Neznámé ID řidiče!");
                loginClear();
            }
        } else {
            if(app.buffer === CONFIG.driverPin) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('ui-app').style.display = 'flex';
                app.loggedIn = true;
                initApp();
            } else {
                alert("Chybný PIN!");
                loginClear();
            }
        }
    }

    // 3. HLAVNÍ APLIKACE
    function initApp() {
        renderStops();
        setInterval(tick, 1000);
    }

    function tick() {
        const now = new Date();
        document.getElementById('h-clock').innerText = now.toLocaleTimeString('cs-CZ');
        
        // Zpoždění
        const plan = CONFIG.stops[app.activeIdx].t.split(':');
        const pDate = new Date();
        pDate.setHours(plan[0], plan[1], 0);
        
        const diff = Math.floor((now - pDate) / 60000);
        const delEl = document.getElementById('h-delay');
        delEl.innerText = (diff >= 0 ? "+" : "") + diff + " m";
        delEl.className = `delay-pill ${diff > 0 ? 'delay-late' : 'delay-ok'}`;
    }

    function renderStops() {
        const cont = document.getElementById('stop-cont');
        cont.innerHTML = '';
        CONFIG.stops.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = `stop-row ${i === app.activeIdx ? 'active' : ''}`;
            div.innerHTML = `<div>${s.t}</div><div style="font-size:9px; color:gray">25|</div><div>${s.n}</div>`;
            cont.appendChild(div);
        });
        const act = cont.querySelector('.active');
        if(act) act.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function driveNext() {
        if(app.activeIdx < CONFIG.stops.length - 1) {
            app.activeIdx++;
            renderStops();
            playGong();
        }
    }

    function playGong() {
        const g = document.getElementById('snd-gong');
        g.currentTime = 0;
        g.play().catch(() => {});
    }

    function setTicket(btn, p) {
        document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        app.price = p;
        document.getElementById('v-price').innerText = p.toFixed(2).replace('.', ',') + " Kč";
    }

    function sell() {
        alert("Lístek vytisknut: " + app.price + " Kč");
    }

    function storno() {
        console.log("Storno akce");
    }
</script>
</body>
</html>
